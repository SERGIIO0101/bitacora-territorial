                      : <div className="flex h-20 items-center justify-center bg-surface2 text-ink3"><Icon n="file-text" s={22} /></div>}
                    <div className="flex items-center gap-1 p-1.5">
                      <Icon n={on ? 'check-square' : 'square'} s={13} className={on ? 'text-azure' : 'text-ink3'} />
                      <span className="truncate text-[10.5px] text-ink2">{e.nombre}</span>
                    </div>
                  </button>
                );
              })}
            </div>}
      </section>

      <Campo label="Conclusiones y cierre">
        <textarea rows={2} className="fld resize-y" id="ac-concl" value={a.conclusiones} onChange={e => up('conclusiones', e.target.value)} />
      </Campo>

    </div>
  );
}

function Actas({ pedido, limpiarPedido }){
  const { st, setSt, toast, abrirDoc } = useApp();
  const [edit, setEdit] = useState(null);

  useEffect(() => {
    if (!pedido) return;
    if (pedido.desdeActividad){
      const base = st.actividades.find(x => x.id === pedido.desdeActividad);
      setEdit(actaNueva(st, base));
    }
    limpiarPedido();
  }, [pedido]);

  const guardar = a => {
    setSt(p => ({ ...p, actas: p.actas.some(x => x.id === a.id) ? p.actas.map(x => x.id === a.id ? a : x) : [a, ...p.actas] }));
    setEdit(null);
    toast('Acta guardada. Ya puedes exportarla.', 'verde');
  };
  const eliminar = id => { setSt(p => ({ ...p, actas:p.actas.filter(x => x.id !== id) })); toast('Acta eliminada.', 'ambar'); };

  const lista = [...st.actas].sort((a,b) => (b.fecha||'').localeCompare(a.fecha||''));

  return (
    <div className="space-y-4">
      <Card className="flex flex-wrap items-center justify-between gap-3 p-4">
        <div>
          <h2 className="font-display text-[16px] font-bold">Actas de comité</h2>
          <p className="text-[12.5px] text-ink3">Orden del día, desarrollo, compromisos y anexo fotográfico al final.</p>
        </div>
        <Boton icon="file-plus" onClick={() => setEdit(actaNueva(st))}>Nueva acta</Boton>
      </Card>

      {lista.length === 0
        ? <Vacio icon="file-text" titulo="Todavía no hay actas" texto="Crea un acta desde cero o genérala a partir de una actividad ya capturada." />
        : <div className="space-y-2">
            {lista.map(a => {
              const o = obl(a.obligacionId);
              const pend = (a.compromisos||[]).filter(c => c.estado !== 'Cumplido').length;
              return (
                <Card key={a.id} className="rail p-3.5 pl-4" style={{ '--rail':'rgb(var(--azure))' }}>
                  <div className="flex flex-wrap items-start justify-between gap-2">
                    <div className="min-w-0 flex-1">
                      <div className="flex flex-wrap items-center gap-2">
                        <span className="font-mono text-[11.5px] text-ink3">ACTA {a.consecutivo}-{(a.fecha||'').slice(0,4)}</span>
                        <Chip tone="azure">{o.cod}</Chip>
                        {pend > 0 && <Chip tone="ambar">{pend} compromiso{pend === 1 ? '' : 's'} abierto{pend === 1 ? '' : 's'}</Chip>}
                      </div>
                      <p className="mt-1 font-display text-[14.5px] font-semibold leading-snug">{a.instancia || 'Sin instancia'}</p>
                      <p className="mt-0.5 text-[12px] text-ink3">{fechaLarga(a.fecha)} · {a.lugar || 'sin lugar'} · {(a.evidencias||[]).length} anexos</p>
                    </div>
                    <div className="flex flex-none items-center gap-1">
                      <button onClick={() => abrirDoc(() => construirActa(a, st))} className="rounded-lg border border-line2 bg-surface px-2.5 py-2 text-ink2 hover:bg-surface2" title="Ver y exportar"><Icon n="eye" s={16} /></button>
                      <button onClick={() => setEdit(a)} className="rounded-lg border border-line2 bg-surface px-2.5 py-2 text-ink2 hover:bg-surface2" title="Editar"><Icon n="pencil" s={16} /></button>
                      <button onClick={() => eliminar(a.id)} className="rounded-lg border border-line2 bg-surface px-2.5 py-2 text-ink3 hover:bg-rojosoft hover:text-rojo" title="Eliminar"><Icon n="trash-2" s={16} /></button>
                    </div>
                  </div>
                </Card>
              );
            })}
          </div>}

      <Hoja abierta={!!edit} onCerrar={() => setEdit(null)} ancho="max-w-3xl"
            titulo={edit ? `Acta N.º ${edit.consecutivo}` : ''} sub="Se numera automáticamente por año"
            pie={edit && (
              <div className="flex gap-2">
                <Boton icon="check" onClick={() => guardar(edit)} className="flex-1">Guardar acta</Boton>
                <Boton variant="fantasma" onClick={() => setEdit(null)}>Cancelar</Boton>
              </div>
            )}>
        {edit && <EditorActa acta={edit} onChange={setEdit} />}
      </Hoja>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════════
   11. PANTALLA · ENTREGABLES
       Un toque por entregable. Cada botón abre la vista previa del
       documento, ya armado con lo capturado en el período.
   ══════════════════════════════════════════════════════════════════ */
function VisorDiapositivas({ slides, st }){
  const [i, setI] = useState(0);
  const cont = useRef(null);
  const [escala, setEscala] = useState(1);
  const ANCHO = 1040;

  useEffect(() => {
    const medir = () => { if (cont.current) setEscala(Math.min(1, cont.current.clientWidth / ANCHO)); };
    medir();
    window.addEventListener('resize', medir);
    return () => window.removeEventListener('resize', medir);
  }, []);
  useEffect(() => { if (i >= slides.length) setI(0); }, [slides.length]);

  const actual = slides[Math.min(i, slides.length - 1)];
  const html = useMemo(() => actual ? diapositivasHTML([actual], st) : '', [actual, st]);
  if (!actual) return null;

  return (
    <div>
      <div ref={cont} className="overflow-hidden rounded-xl border border-line bg-surface2 p-2">
        <div style={{ height:(ANCHO * 9/16) * escala + 20 }}>
          <div style={{ width:ANCHO, transform:`scale(${escala})`, transformOrigin:'top left' }} dangerouslySetInnerHTML={{ __html:html }} />
        </div>
      </div>
      <div className="mt-2 flex items-center justify-between gap-2">
        <Boton icon="chevron-left" variant="linea" onClick={() => setI(Math.max(0, i-1))} disabled={i === 0}>Anterior</Boton>
        <span className="font-mono text-[12px] tnum text-ink2">{i+1} / {slides.length}</span>
        <Boton variant="linea" onClick={() => setI(Math.min(slides.length-1, i+1))} disabled={i >= slides.length-1}>Siguiente<Icon n="chevron-right" s={17} /></Boton>
      </div>
    </div>
  );
}

function BotonExportar({ icon, titulo, sub, nota, tono = 'azure', onClick }){
  const t = tono === 'fucsia'
    ? 'border-fucsia/40 bg-fucsiasoft text-fucsia'
    : tono === 'verde'
      ? 'border-verde/40 bg-verdesoft text-verde'
      : 'border-azure/40 bg-azuresoft text-azure';
  return (
    <button onClick={onClick}
      className="flex w-full items-center gap-3.5 rounded-2xl border border-line bg-surface p-3.5 text-left shadow-card transition hover:bg-surface2 active:scale-[0.99]">
      <span className={cx('flex h-14 w-14 flex-none items-center justify-center rounded-xl border-2', t)}><Icon n={icon} s={26} stroke={1.6} /></span>
      <span className="min-w-0 flex-1">
        <span className="block font-display text-[15px] font-bold leading-tight">{titulo}</span>
        <span className="mt-0.5 block text-[12.5px] leading-snug text-ink2">{sub}</span>
        {nota && <span className="mt-1 block font-mono text-[11px] text-ink3">{nota}</span>}
      </span>
      <Icon n="chevron-right" s={20} className="flex-none text-ink3" />
    </button>
  );
}

function Entregables({ mes, setMes }){
  const { st, setSt, abrirDoc, toast } = useApp();
  const [verSlides, setVerSlides] = useState(false);
  const [sel, setSel] = useState(null);

  const acts = st.actividades.filter(a => mesDe(a.fecha) === mes);
  const actasMes = st.actas.filter(a => mesDe(a.fecha) === mes).sort((a,b) => b.fecha.localeCompare(a.fecha));
  const conDatos = OBLIGACIONES.filter(o => acts.some(a => a.obligacionId === o.id)).map(o => o.id);
  const ids = sel || (conDatos.length ? conDatos : [1,3,5]);
  const slides = useMemo(() => construirDiapositivas(mes, ids, st), [mes, ids, st]);
  const meses = mesesDisponibles(st.actividades);
  const totalEv = acts.reduce((n,a) => n + (a.evidencias || []).length, 0);
  const cumplidas = OBLIGACIONES.filter(o => acts.filter(a => a.obligacionId === o.id).length >= o.meta).length;

  const TIPOS_SESION = ['Comité de política pública','Consejo Territorial de Paz','Subcomité de Prevención','Mesa técnica'];

  function actaDeUnClic(){
    if (actasMes.length){ abrirDoc(() => construirActa(actasMes[0], st)); return; }
    const delMes = st.actividades.filter(a => mesDe(a.fecha) === mes).sort((a,b) => b.fecha.localeCompare(a.fecha));
    const base = delMes.find(a => TIPOS_SESION.includes(a.tipo)) || delMes[0];
    if (!base){ toast('Aún no hay actividades del período para levantar el acta.', 'ambar'); return; }
    const nueva = actaNueva(st, base);
    setSt(p => ({ ...p, actas:[nueva, ...p.actas] }));
    abrirDoc(() => construirActa(nueva, st));
    toast('Acta borrador armada con la última sesión. Ajústala en Actas.', 'verde');
  }

  return (
    <div className="space-y-4">
      <div>
        <h3 className="eyebrow mb-2 px-1 text-ink2">Período</h3>
        <div className="flex gap-1.5 overflow-x-auto pb-1" style={{ scrollbarWidth:'thin' }}>
          {meses.map(m => (
            <button key={m} onClick={() => setMes(m)}
              className={cx('flex-none rounded-full border px-3.5 py-2 font-display text-[12.5px] font-semibold first-letter:uppercase transition',
                mes === m ? 'border-azure bg-azure text-paper' : 'border-line2 bg-surface text-ink2 hover:bg-surface2')}>
              {mesLargo(m)}
            </button>
          ))}
        </div>
      </div>

      <div className="rounded-2xl border border-line bg-surface2 px-4 py-3">
        <p className="text-[13px] leading-relaxed text-ink2">
          <strong className="text-ink">{acts.length} actividades</strong> y <strong className="text-ink">{totalEv} evidencias</strong> capturadas
          en {mesLargo(mes)}. {cumplidas} de 11 obligaciones alcanzaron la meta.
        </p>
      </div>

      <div className="space-y-2.5">
        <BotonExportar icon="file-text" titulo="Informe mensual de ejecución" tono="azure"
          sub="Las 11 obligaciones con sus actividades, anexo fotográfico y certificación para la cuenta de cobro."
          nota={`${acts.length} actividades · ${totalEv} evidencias`}
          onClick={() => abrirDoc(() => construirInforme(mes, st))} />

        <BotonExportar icon="presentation" titulo="Diapositivas ejecutivas" tono="fucsia"
          sub="Portada, cifras, semáforo, una lámina por obligación con logros y fotos, compromisos y próximos pasos."
          nota={`${slides.length} diapositivas`}
          onClick={() => abrirDoc(() => ({ titulo:'Presentación ejecutiva — ' + mesLargo(mes), archivo:'Diapositivas_' + mes + '.doc',
            html:diapositivasHTML(slides, st), esDiapositivas:true }))} />

        <BotonExportar icon="file-signature" titulo="Acta de comité" tono="verde"
          sub={actasMes.length
            ? `Última acta del período: ${actasMes[0].instancia}.`
            : 'Se arma un borrador con la última sesión capturada y queda editable en Actas.'}
          nota={actasMes.length ? `Acta ${actasMes[0].consecutivo} · ${fechaCorta(actasMes[0].fecha)}` : 'Borrador automático'}
          onClick={actaDeUnClic} />
      </div>

      <Card className="p-4">
        <h3 className="font-display text-[14.5px] font-bold">Qué va a salir en el informe</h3>
        <div className="mt-2.5 grid gap-1.5">
          {OBLIGACIONES.map(o => {
            const n = acts.filter(a => a.obligacionId === o.id).length;
            const e = estadoSem(n, o.meta);
            return (
              <div key={o.id} className="flex items-center gap-2.5 rounded-lg border border-line px-3 py-2">
                <span className="font-mono text-[11px] text-ink3">{o.cod}</span>
                <span className="min-w-0 flex-1 truncate text-[13px]">{o.corto}</span>
                <span className={cx('h-2 w-2 flex-none rounded-full', SEM[e.k].dot)} />
                <span className="w-12 flex-none text-right font-mono text-[11.5px] tnum text-ink2">{n}/{o.meta}</span>
              </div>
            );
          })}
        </div>
      </Card>

      <button onClick={() => setVerSlides(v => !v)}
        className="flex w-full items-center justify-between rounded-xl border border-line bg-surface px-3.5 py-3 text-left">
        <span className="font-display text-[13.5px] font-semibold">Previsualizar diapositivas <span className="font-normal text-ink3">— y elegir obligaciones</span></span>
        <Icon n={verSlides ? 'chevron-up' : 'chevron-down'} s={18} className="text-ink3" />
      </button>

      {verSlides && (
        <Card className="space-y-3 p-4 anim-in">
          <div className="flex flex-wrap gap-1.5">
            {OBLIGACIONES.map(o => {
              const on = ids.includes(o.id);
              return (
                <button key={o.id} onClick={() => setSel(on ? ids.filter(x => x !== o.id) : [...ids, o.id].sort((a,b) => a-b))}
                  className={cx('rounded-lg border px-2.5 py-1.5 font-mono text-[11.5px] transition',
                    on ? 'border-azure bg-azuresoft text-azure' : 'border-line2 bg-surface text-ink3 hover:bg-surface2')}>
                  {o.cod}
                </button>
              );
            })}
          </div>
          <VisorDiapositivas slides={slides} st={st} />
        </Card>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════════
   13. VISOR DE DOCUMENTO — copiar a Word · imprimir · descargar
   ══════════════════════════════════════════════════════════════════ */
function VisorDocumento({ doc, onCerrar }){
  const { toast } = useApp();
  const hoja = useRef(null);
  const [descargas, setDescargas] = useState(null);

  // En el visor de artifacts la descarga la media la plataforma; en la PWA local es un enlace normal.
  useEffect(() => {
    let vivo = true;
    (async () => {
      try{
        const d = (window.claude && window.claude.use) ? await window.claude.use('downloads') : null;
        if (vivo) setDescargas(d);
      }catch(e){ /* sin capacidad de descarga: quedan copiar e imprimir */ }
    })();
    return () => { vivo = false; };
  }, []);

  useEffect(() => {
    document.body.classList.toggle('doc-open', !!doc);
    return () => document.body.classList.remove('doc-open');
  }, [doc]);
  useEffect(() => {
    const h = e => { if (e.key === 'Escape') onCerrar(); };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, [onCerrar]);
  if (!doc) return null;

  async function descargar(){
    const html = envolverWord(doc.titulo, doc.html, ESTILOS_DOC);
    if (descargas){
      try{
        await descargas.save({ filename:doc.archivo.replace(/\.doc$/, '.html'), data:html });
        toast('Descargado. Ábrelo con Word y guárdalo como .docx.', 'verde');
      }catch(e){
        if (e && e.code === 'declined') return;
        toast('No se pudo descargar el archivo; usa Copiar a Word.', 'ambar');
      }
      return;
    }
    const ok = descargarDoc(doc.archivo, html);
    toast(ok ? 'Archivo .doc descargado.' : 'La descarga fue bloqueada; usa Copiar a Word.', ok ? 'verde' : 'ambar');
  }

  const copiar = async () => {
    const ok = await copiarRico(envolverWord(doc.titulo, doc.html, ESTILOS_DOC), hoja.current ? hoja.current.innerText : '');
    toast(ok ? 'Copiado. Pega en Word con Ctrl+V y conserva el formato.' : 'El navegador bloqueó el portapapeles; usa Imprimir.', ok ? 'verde' : 'ambar');
  };

  return (
    <div className="doc-overlay fixed inset-0 z-50 overflow-y-auto bg-ink/60 px-0 py-0 sm:px-4 sm:py-6">
      <div className="no-print sticky top-0 z-10 flex flex-wrap items-center gap-2 border-b border-line bg-paper px-3 py-2.5"
           style={{ paddingTop:'calc(10px + env(safe-area-inset-top, 0px))' }}>
        <button onClick={onCerrar} aria-label="Cerrar documento" className="rounded-lg p-1.5 text-ink2 hover:bg-surface2"><Icon n="arrow-left" s={19} /></button>
        <div className="min-w-0 flex-1">
          <p className="truncate font-display text-[13.5px] font-semibold">{doc.titulo}</p>
          <p className="text-[11px] text-ink3">Documento generado · listo para firma</p>
        </div>
        <Boton icon="copy" variant="linea" onClick={copiar}>Copiar a Word</Boton>
        <Boton icon="printer" variant="linea" onClick={() => window.print()}>Imprimir / PDF</Boton>
        {(descargas || !SANDBOX) && (
          <Boton icon="download" onClick={descargar}>{descargas ? 'Descargar' : 'Descargar .doc'}</Boton>
        )}
      </div>
      <div ref={hoja}
           className={cx('doc-sheet mx-auto bg-white shadow-pop', doc.esDiapositivas ? 'p-3 sm:p-6' : 'doc p-5 sm:p-10')}
           style={{ maxWidth:doc.esDiapositivas ? '1100px' : '820px' }}
           dangerouslySetInnerHTML={{ __html:doc.html }} />
      <div className="h-10" />
    </div>
  );
}

const NAV = [
  ['inicio','Inicio','home'],
  ['actas','Actas','file-text'],
  ['entregables','Entregables','presentation'],
  ['ajustes','Ajustes','settings']
];

function App(){
  const [st, setSt] = useState(cargarEstado);
  const [tab, setTab] = useState('inicio');
  const [mes, setMes] = useState(mesDe(hoyISO()));
  const [prefill, setPrefill] = useState(null);
  const [pedido, setPedido] = useState(null);
  const [doc, setDoc] = useState(null);
  const [aviso, setAviso] = useState(null);
  const [guia, setGuia] = useState(false);
  const [generando, setGenerando] = useState(false);
  const [persistido, setPersistido] = useState(true);

  useEffect(() => {
    const ok = guardarEstado(st);
    setPersistido(p => p === ok ? p : ok);
  }, [st]);

  useEffect(() => {
    const r = document.documentElement;
    if (st.tema === 'auto') r.removeAttribute('data-theme');
    else r.setAttribute('data-theme', st.tema);
  }, [st.tema]);

  const toast = useCallback((texto, tono = 'verde', accion = null) => {
    const id = Date.now();
    setAviso({ texto, tono, accion, id });
    setTimeout(() => setAviso(a => (a && a.id === id) ? null : a), accion ? 9000 : 4200);
  }, []);

  /* Un informe con muchas fotos tarda un momento en armarse: se pinta primero
     el aviso de carga y se construye en el siguiente cuadro. */
  const abrirDoc = useCallback(entrada => {
    if (typeof entrada !== 'function'){ setDoc(entrada); return; }
    setGenerando(true);
    setTimeout(() => {
      try { setDoc(entrada()); }
      finally { setGenerando(false); }
    }, 40);
  }, []);

  const ir = useCallback((destino, carga) => {
    setTab(destino);
    if (destino === 'capturar') setPrefill(carga || null);
    if (destino === 'actas') setPedido(carga || null);
    window.scrollTo({ top:0, behavior:'smooth' });
  }, []);

  const ctx = useMemo(() => ({ st, setSt, toast, ir, abrirDoc, persistido }), [st, toast, ir, abrirDoc, persistido]);
  const sinDatos = st.config.contratista.startsWith('«');
  const meses = mesesDisponibles(st.actividades);

  return (
    <Ctx.Provider value={ctx}>
      <div className="app-shell mx-auto flex min-h-full w-full max-w-5xl flex-col px-4 pb-32"
           style={{ paddingTop:'env(safe-area-inset-top, 0px)' }}>

        <header className="sticky z-20 -mx-4 mb-4 border-b border-line bg-paper/90 px-4 py-3 backdrop-blur"
                style={{ top:'env(safe-area-inset-top, 0px)' }}>
          <div className="flex items-center gap-3">
            {window.ESCUDO_MUNICIPAL
              ? <img src={window.ESCUDO_MUNICIPAL} alt={'Escudo de ' + st.config.municipio}
                     className="h-10 w-10 flex-none rounded-lg bg-white object-contain p-px" />
              : <div className="flex h-9 w-9 flex-none items-center justify-center rounded-lg bg-azure font-display text-[13px] font-bold text-paper">BT</div>}
            <div className="min-w-0 flex-1">
              <h1 className="font-display text-[15.5px] font-bold leading-none">{tab === 'capturar' ? 'Captura rápida' : 'Bitácora Territorial'}</h1>
              <p className="mt-1 truncate text-[11.5px] text-ink3">{tab === 'capturar' ? 'Graba o fotografía; el resto ya viene puesto' : st.config.municipio + ' · ' + st.config.dependencia}</p>
            </div>
            <button onClick={() => setGuia(true)} aria-label="Guía de uso"
              className="flex h-9 w-9 flex-none items-center justify-center rounded-lg border border-line2 bg-surface text-ink2 hover:bg-surface2">
              <Icon n="help-circle" s={18} />
            </button>
            {(tab === 'inicio' || tab === 'entregables') && (
              <select value={mes} onChange={e => setMes(e.target.value)} aria-label="Período" id="hdr-mes"
                className="rounded-lg border border-line2 bg-surface px-2.5 py-1.5 font-mono text-[12px] tnum">
                {meses.map(m => <option key={m} value={m}>{m}</option>)}
              </select>
            )}
          </div>
        </header>

        {sinDatos && tab !== 'ajustes' && (
          <button onClick={() => setTab('ajustes')}
            className="mb-4 flex w-full items-center gap-2.5 rounded-xl border border-fucsia/30 bg-fucsiasoft px-3.5 py-2.5 text-left">
            <Icon n="user-cog" s={17} className="flex-none text-fucsia" />
            <span className="flex-1 text-[12.5px] leading-snug text-ink">Completa los datos del contrato para que las actas e informes salgan con tu nombre.</span>
            <Icon n="chevron-right" s={16} className="flex-none text-fucsia" />
          </button>
        )}

        <main className="flex-1 anim-in" key={tab}>
          {tab === 'inicio' && <Inicio mes={mes} setMes={setMes} />}
          {tab === 'capturar' && <Capturar prefill={prefill} limpiarPrefill={() => setPrefill(null)} />}
          {tab === 'actas' && <Actas pedido={pedido} limpiarPedido={() => setPedido(null)} />}
          {tab === 'entregables' && <Entregables mes={mes} setMes={setMes} />}
          {tab === 'ajustes' && <Ajustes />}
        </main>

        <footer className="mt-8 border-t border-line pt-4 text-[11.5px] leading-relaxed text-ink3">
          {APP.nombre} {APP.version} · captura en campo, entregables con formato oficial.
          <span className="mt-1 block">Editor: <strong className="text-ink2">{APP.editor}</strong> · para la Alcaldía Municipal de {st.config.municipio}, {st.config.departamento}.</span>
        </footer>
      </div>

      {aviso && (
        <div className="fixed inset-x-0 z-40 flex justify-center px-4" style={{ bottom:'calc(106px + env(safe-area-inset-bottom, 0px))' }}>
          <div className={cx('anim-in flex max-w-md items-start gap-2 rounded-xl border px-3.5 py-2.5 shadow-pop',
            aviso.tono === 'verde' ? 'border-verde/30 bg-verdesoft text-verde' :
            aviso.tono === 'rojo' ? 'border-rojo/30 bg-rojosoft text-rojo' : 'border-ambar/30 bg-ambarsoft text-ambar')}>
            <Icon n={aviso.tono === 'verde' ? 'check-circle' : 'alert-circle'} s={16} className="mt-0.5 flex-none" />
            <span className="flex-1 text-[13px] font-medium leading-snug">{aviso.texto}</span>
            {aviso.accion && (
              <button onClick={() => { aviso.accion.hacer(); setAviso(null); }}
                className="flex-none rounded-lg border border-current px-2 py-1 font-display text-[12px] font-bold">
                {aviso.accion.etiqueta}
              </button>
            )}
          </div>
        </div>
      )}

      <nav className="fixed inset-x-0 bottom-0 z-30 border-t border-line bg-paper/95 backdrop-blur"
           style={{ paddingBottom:'env(safe-area-inset-bottom, 0px)' }}>
        <div className="relative mx-auto flex max-w-5xl">
          {NAV.map(([k,l,ic], i) => (
            <React.Fragment key={k}>
              {i === 2 && <span className="w-[84px] flex-none" aria-hidden="true" />}
              <button onClick={() => ir(k)} aria-current={tab === k ? 'page' : undefined}
                className={cx('flex flex-1 flex-col items-center gap-1 py-2.5 transition', tab === k ? 'text-azure' : 'text-ink3 hover:text-ink2')}>
                <span className={cx('flex h-7 w-12 items-center justify-center rounded-full transition', tab === k ? 'bg-azuresoft' : '')}>
                  <Icon n={ic} s={19} stroke={tab === k ? 2.25 : 1.6} />
                </span>
                <span className="font-display text-[10.5px] font-semibold">{l}</span>
              </button>
            </React.Fragment>
          ))}
          <button onClick={() => ir(tab === 'capturar' ? 'inicio' : 'capturar')}
            aria-label={tab === 'capturar' ? 'Cerrar captura' : 'Capturar evidencia'}
            className={cx('absolute -top-7 left-1/2 flex h-16 w-16 -translate-x-1/2 items-center justify-center rounded-full border-4 border-paper shadow-pop transition active:scale-95',
              tab === 'capturar' ? 'bg-fucsia text-paper' : 'bg-azure text-paper')}>
            <Icon n={tab === 'capturar' ? 'x' : 'plus'} s={30} stroke={2.4} />
          </button>
        </div>
      </nav>

      {generando && (
        <div className="anim-fade fixed inset-0 z-50 flex flex-col items-center justify-center gap-3 bg-paper/85 backdrop-blur-sm">
          <Icon n="loader-2" s={30} className="giro text-azure" />

          <p className="text-[12.5px] text-ink3">Compilando actividades y anexo fotográfico</p>
        </div>
      )}

      <Guia abierta={guia} onCerrar={() => setGuia(false)} />
      <VisorDocumento doc={doc} onCerrar={() => setDoc(null)} />
    </Ctx.Provider>
  );
}
