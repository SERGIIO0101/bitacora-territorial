    if (s.t === 'semaforo') return wrap(h2(s.titulo, s.sub) +
      '<table style="width:100%;border-collapse:collapse;font-size:13px">' + s.filas.map(f =>
        '<tr><td style="padding:7px 8px;border-bottom:1px solid #E4EAEB;font-family:Consolas,monospace;color:#7a8a90;width:56px">' + esc(f.cod) + '</td>' +
        '<td style="padding:7px 8px;border-bottom:1px solid #E4EAEB">' + esc(f.nombre) + '</td>' +
        '<td style="padding:7px 8px;border-bottom:1px solid #E4EAEB;width:230px"><div style="background:#E9EEEF;height:9px;border-radius:9px"><div style="width:' + f.p + '%;background:' + P[f.k] + ';height:9px;border-radius:9px"></div></div></td>' +
        '<td style="padding:7px 8px;border-bottom:1px solid #E4EAEB;width:96px;text-align:right;color:' + P[f.k] + ';font-weight:700">' + f.n + ' / ' + f.meta + '</td></tr>').join('') + '</table>' + pie('Semáforo de cumplimiento'));
    if (s.t === 'obligacion') return wrap(h2(s.titulo, s.cod + ' · ' + s.sub) +
      '<div style="display:grid;grid-template-columns:1.25fr 1fr;gap:26px">' +
      '<div><div style="font-size:12px;color:#7a8a90;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px">Logros del período</div>' +
      (s.logros.length ? '<ul style="margin:0;padding-left:18px;font-size:14px;line-height:1.5">' + s.logros.map(l => '<li style="margin-bottom:7px"><strong>' + esc(l.fecha) + '</strong> — ' + esc(l.texto) + '</li>').join('') + '</ul>' : '<div style="color:#AB342D;font-size:14px">Sin actividades registradas en el período.</div>') +
      '<div style="margin-top:18px;display:flex;align-items:baseline;gap:10px"><span style="font-size:36px;font-weight:700;color:' + P[s.k] + '">' + s.p + '%</span><span style="font-size:13px;color:#33474e">' + s.n + ' de ' + s.meta + ' actividades programadas</span></div></div>' +
      '<div style="display:grid;gap:8px;align-content:start">' + (s.fotos.length ? s.fotos.map(f =>
        '<figure style="margin:0"><img src="' + f.src + '" style="width:100%;height:96px;object-fit:cover;border:1px solid #C7D2D6"><figcaption style="font-size:10px;color:#7a8a90;padding-top:3px">' + esc(f.pie) + '</figcaption></figure>').join('')
        : '<div style="border:1px dashed #C7D2D6;padding:22px;text-align:center;color:#7a8a90;font-size:12px">Sin registro fotográfico</div>') + '</div></div>' + pie(s.cod));
    if (s.t === 'compromisos') return wrap(h2(s.titulo, s.sub) +
      '<table style="width:100%;border-collapse:collapse;font-size:12.5px"><tr><th style="text-align:left;padding:6px;background:#EAF1F4">Compromiso</th><th style="text-align:left;padding:6px;background:#EAF1F4">Responsable</th><th style="text-align:left;padding:6px;background:#EAF1F4;width:110px">Fecha</th><th style="text-align:left;padding:6px;background:#EAF1F4;width:96px">Estado</th></tr>' +
      s.filas.map(c => '<tr><td style="padding:6px;border-bottom:1px solid #E4EAEB">' + esc(c.descripcion) + '</td><td style="padding:6px;border-bottom:1px solid #E4EAEB">' + esc(c.entidad) + '</td><td style="padding:6px;border-bottom:1px solid #E4EAEB">' + (c.fecha ? fechaCorta(c.fecha) : '—') + '</td><td style="padding:6px;border-bottom:1px solid #E4EAEB">' + esc(c.estado) + '</td></tr>').join('') + '</table>' + pie('Seguimiento a compromisos'));
    return wrap(h2(s.titulo, s.sub) +
      '<ul style="font-size:15px;line-height:1.6;padding-left:18px">' + s.puntos.map(p => '<li style="margin-bottom:9px">' + esc(p) + '</li>').join('') + '</ul>' +
      '<div style="position:absolute;left:48px;bottom:56px;font-size:13px;color:#33474e">' + esc(s.autor) + ' — ' + esc(s.dependencia) + '</div>' + pie('Cierre'));
  }).join('');
}

/* ══════════════════════════════════════════════════════════════════
   7. PRIMITIVAS DE INTERFAZ
   ══════════════════════════════════════════════════════════════════ */
const Ctx = React.createContext(null);
const useApp = () => React.useContext(Ctx);

const pascal = n => String(n).split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join('');
function Icon({ n, s = 20, className = '', stroke = 1.75 }){
  const lib = (window.lucide && (window.lucide.icons || window.lucide)) || {};
  let node = lib[pascal(n)] || lib[n];
  if (node && node[0] === 'svg') node = node[2];
  const hijos = Array.isArray(node) ? node : null;
  return (
    <svg xmlns="http://www.w3.org/2000/svg" width={s} height={s} viewBox="0 0 24 24" fill="none"
         stroke="currentColor" strokeWidth={stroke} strokeLinecap="round" strokeLinejoin="round"
         className={className} aria-hidden="true" focusable="false">
      {hijos
        ? hijos.map(([tag, attrs], i) => React.createElement(tag, { key:i, ...attrs }))
        : <circle cx="12" cy="12" r="8" />}
    </svg>
  );
}

const Chip = ({ children, tone = 'neutro', className = '' }) => {
  const t = { neutro:'bg-surface2 text-ink2 border-line2', azure:'bg-azuresoft text-azure border-azure/30',
    fucsia:'bg-fucsiasoft text-fucsia border-fucsia/30', verde:'bg-verdesoft text-verde border-verde/30',
    ambar:'bg-ambarsoft text-ambar border-ambar/30', rojo:'bg-rojosoft text-rojo border-rojo/30' }[tone];
  return <span className={cx('inline-flex items-center gap-1.5 rounded-full border px-2.5 py-1 text-[11px] font-display font-semibold uppercase tracking-wide', t, className)}>{children}</span>;
};

const Card = ({ children, className = '', ...p }) => (
  <div {...p} className={cx('rounded-2xl border border-line bg-surface shadow-card', className)}>{children}</div>
);

const Campo = ({ label, hint, children, req, className = '' }) => (
  <label className={cx('block', className)}>
    <span className="eyebrow text-ink2 flex items-center gap-1.5">{label}{req && <span className="text-fucsia">*</span>}</span>
    <div className="mt-1.5">{children}</div>
    {hint && <span className="mt-1 block text-[12px] leading-snug text-ink3">{hint}</span>}
  </label>
);

function Boton({ children, icon, variant = 'primario', className = '', ...p }){
  const v = {
    primario:'bg-azure text-paper border-azure hover:brightness-110',
    fucsia:'bg-fucsia text-paper border-fucsia hover:brightness-110',
    suave:'bg-surface2 text-ink border-line2 hover:bg-surface3',
    linea:'bg-surface text-ink border-line2 hover:bg-surface2',
    fantasma:'bg-transparent text-ink2 border-transparent hover:bg-surface2'
  }[variant];
  return (
    <button {...p} className={cx('inline-flex items-center justify-center gap-2 rounded-xl border px-3.5 py-2.5 font-display text-[13.5px] font-semibold transition disabled:opacity-40 disabled:pointer-events-none', v, className)}>
      {icon && <Icon n={icon} s={17} />}{children}
    </button>
  );
}

function Hoja({ abierta, onCerrar, titulo, sub, children, pie, ancho = 'max-w-2xl' }){
  useEffect(() => {
    if (!abierta) return;
    const h = e => { if (e.key === 'Escape') onCerrar(); };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, [abierta, onCerrar]);
  if (!abierta) return null;
  return (
    <div className="fixed inset-0 z-40 flex items-end sm:items-center justify-center" role="dialog" aria-modal="true" aria-label={titulo}>
      <div className="anim-fade absolute inset-0 bg-ink/40 backdrop-blur-[2px]" onClick={onCerrar} />
      <div className={cx('relative w-full anim-sube bg-paper shadow-pop rounded-t-3xl sm:rounded-2xl border border-line flex flex-col overflow-hidden', ancho)}
           style={{ maxHeight:'min(90vh, 900px)' }}>
        <div className="flex items-start gap-3 border-b border-line px-4 py-3.5 sm:px-5">
          <div className="min-w-0 flex-1">
            <h2 className="font-display text-[16px] font-bold leading-tight">{titulo}</h2>
            {sub && <p className="mt-0.5 text-[12.5px] text-ink3 leading-snug">{sub}</p>}
          </div>
          <button onClick={onCerrar} aria-label="Cerrar" className="rounded-lg p-1.5 text-ink2 hover:bg-surface2"><Icon n="x" s={20} /></button>
        </div>
        <div className="flex-1 overflow-y-auto px-4 py-4 sm:px-5">{children}</div>
        {pie && (
          <div className="border-t border-line bg-paper px-4 py-3 sm:px-5"
               style={{ paddingBottom:'calc(12px + env(safe-area-inset-bottom, 0px))' }}>
            {pie}
          </div>
        )}
      </div>
    </div>
  );
}

function Barra({ p, k = 'azure', alto = 'h-2' }){
  const c = { azure:'bg-azure', verde:'bg-verde', ambar:'bg-ambar', rojo:'bg-rojo' }[k];
  return (
    <div className={cx('w-full overflow-hidden rounded-full bg-surface3', alto)}>
      <div className={cx('h-full rounded-full transition-all duration-500', c)} style={{ width:Math.max(p, 2) + '%' }} />
    </div>
  );
}

const Vacio = ({ icon, titulo, texto, accion }) => (
  <div className="flex flex-col items-center gap-2 rounded-2xl border border-dashed border-line2 px-5 py-9 text-center">
    <Icon n={icon} s={26} className="text-ink3" />
    <p className="font-display text-[14.5px] font-semibold">{titulo}</p>
    <p className="max-w-sm text-[13px] leading-relaxed text-ink3">{texto}</p>
    {accion}
  </div>
);

/* ══════════════════════════════════════════════════════════════════
   8. PANTALLA · INICIO
      Feed de evidencias para revisar con el pulgar, con el semáforo
      de las 11 obligaciones siempre visible en la banda superior.
   ══════════════════════════════════════════════════════════════════ */
function TarjetaActividad({ a, estado, fotos, extras, onAbrir, onActa }){
  const o = obl(a.obligacionId);
  return (
    <Card className="overflow-hidden rail" style={{ '--rail':SEM[estado.k].rail }}>
      <button onClick={onAbrir} className="block w-full text-left">
        <div className="flex items-center gap-2.5 py-3 pl-4 pr-3.5">
          <span className="flex h-10 w-10 flex-none items-center justify-center rounded-full bg-azuresoft text-azure"><Icon n={o.icon} s={18} /></span>
          <div className="min-w-0 flex-1">
            <div className="flex items-center gap-1.5">
              <span className="font-mono text-[11px] text-ink3">{o.cod}</span>
              <span className={cx('h-2 w-2 rounded-full', SEM[estado.k].dot)} />
              <span className="truncate text-[11.5px] text-ink3">{estado.label}</span>
            </div>
            <p className="truncate font-display text-[13.5px] font-semibold">{o.corto}</p>
          </div>
          <span className="flex-none text-[11.5px] text-ink3">{fechaRelativa(a.fecha)}</span>
        </div>

        {fotos.length > 0 && (
          <div className="relative">
            <img src={fotos[0].dataUrl} alt={fotos[0].nombre} className="h-52 w-full bg-surface2 object-cover sm:h-64" />
            {fotos.length > 1 && (
              <span className="absolute bottom-2 right-2 rounded-lg bg-ink/70 px-2 py-1 font-mono text-[11px] text-paper">+{fotos.length - 1}</span>
            )}
          </div>
        )}

        <div className="py-3 pl-4 pr-3.5">
          <p className="font-display text-[15px] font-semibold leading-snug">{a.titulo}</p>
          <p className="mt-1 text-[13px] leading-relaxed text-ink2"
             style={{ display:'-webkit-box', WebkitLineClamp:2, WebkitBoxOrient:'vertical', overflow:'hidden' }}>
            {a.descripcion || a.notaCruda}
          </p>
          <div className="mt-2 flex flex-wrap items-center gap-x-3 gap-y-1 text-[11.5px] text-ink3">
            {a.lugar && <span className="inline-flex items-center gap-1"><Icon n="map-pin" s={12} />{a.lugar}</span>}
            {a.participantes > 0 && <span className="inline-flex items-center gap-1"><Icon n="users" s={12} />{a.participantes}</span>}
            {extras > 0 && <span className="inline-flex items-center gap-1"><Icon n="paperclip" s={12} />{extras} soporte{extras === 1 ? '' : 's'}</span>}
          </div>
        </div>
      </button>
      <div className="flex divide-x divide-line border-t border-line">
        <button onClick={onAbrir} className="flex flex-1 items-center justify-center gap-1.5 py-3 text-[12.5px] font-semibold text-ink2 hover:bg-surface2">
          <Icon n="maximize-2" s={15} />Ver
        </button>
        <button onClick={onActa} className="flex flex-1 items-center justify-center gap-1.5 py-3 text-[12.5px] font-semibold text-azure hover:bg-azuresoft">
          <Icon n="file-plus" s={15} />Acta
        </button>
      </div>
    </Card>
  );
}

function Inicio({ mes, setMes }){
  const { st, setSt, ir, toast } = useApp();
  const [detalle, setDetalle] = useState(null);
  const [actividad, setActividad] = useState(null);
  const [verTodo, setVerTodo] = useState(false);
  const [editando, setEditando] = useState(null);

  const acts = useMemo(() => st.actividades.filter(a => mesDe(a.fecha) === mes), [st.actividades, mes]);
  const filas = useMemo(() => OBLIGACIONES.map(o => {
    const sub = acts.filter(a => a.obligacionId === o.id).sort((a,b) => b.fecha.localeCompare(a.fecha));
    return { o, sub, e:estadoSem(sub.length, o.meta), ev:sub.reduce((n,a) => n + (a.evidencias||[]).length, 0) };
  }), [acts]);
  const porObligacion = useMemo(() => {
    const m = {};
    filas.forEach(f => { m[f.o.id] = f.e; });
    return m;
  }, [filas]);

  const feed = useMemo(() => [...acts].sort((a,b) =>
    (b.fecha + (b.hora || '')).localeCompare(a.fecha + (a.hora || ''))), [acts]);
  const evDe = useCallback(a => st.evidencias.filter(e => (a.evidencias || []).includes(e.id)), [st.evidencias]);

  const totalEv = filas.reduce((n,f) => n + f.ev, 0);
  const global = Math.round(filas.reduce((s,f) => s + f.e.p, 0) / 11);
  const vencidos = useMemo(() => st.actas.flatMap(a => (a.compromisos || []).map(c => ({ ...c, instancia:a.instancia })))
    .filter(c => c.estado !== 'Cumplido' && c.fecha && c.fecha < hoyISO()), [st.actas]);
  const enRojo = filas.filter(f => f.e.k === 'rojo');
  const abrirActa = a => ir('actas', { desdeActividad:a.id });

  /* Borrar no es definitivo de inmediato: queda unos segundos para deshacer,
     que es lo que salva la foto eliminada por error. */
  function borrarEvidencia(ev, actividadId){
    setSt(p => ({ ...p,
      evidencias:p.evidencias.filter(e => e.id !== ev.id),
      actividades:p.actividades.map(a => a.id === actividadId
        ? { ...a, evidencias:(a.evidencias || []).filter(id => id !== ev.id) } : a) }));
    setActividad(a => a && a.id === actividadId
      ? { ...a, evidencias:(a.evidencias || []).filter(id => id !== ev.id) } : a);
    toast('Evidencia eliminada.', 'ambar', { etiqueta:'Deshacer', hacer(){
      setSt(p => ({ ...p,
        evidencias:[...p.evidencias, ev],
        actividades:p.actividades.map(a => a.id === actividadId
          ? { ...a, evidencias:[...(a.evidencias || []), ev.id] } : a) }));
      setActividad(a => a && a.id === actividadId
        ? { ...a, evidencias:[...(a.evidencias || []), ev.id] } : a);
    } });
  }

  function guardarActividad(edit){
    const nuevas = edit._nuevasFotos || [];
    const limpio = { ...edit };
    delete limpio._nuevasFotos;
    limpio.evidencias = [...(limpio.evidencias || []), ...nuevas.map(e => e.id)];
    setSt(p => ({ ...p,
      actividades:p.actividades.map(x => x.id === limpio.id ? limpio : x),
      evidencias:[...p.evidencias, ...nuevas.map(e => ({ ...e, actividadId:limpio.id }))] }));
    setEditando(null);
    toast('Actividad actualizada.', 'verde');
  }

  function borrarActividad(a){
    const evs = st.evidencias.filter(e => (a.evidencias || []).includes(e.id));
    setSt(p => ({ ...p,
      actividades:p.actividades.filter(x => x.id !== a.id),
      evidencias:p.evidencias.filter(e => !(a.evidencias || []).includes(e.id)) }));
    setActividad(null);
    toast('Actividad eliminada.', 'ambar', { etiqueta:'Deshacer', hacer(){
      setSt(p => ({ ...p, actividades:[a, ...p.actividades], evidencias:[...p.evidencias, ...evs] }));
    } });
  }

  return (
    <div className="space-y-4">
      {/* Avance: visible al abrir la app, sin un solo toque */}
      <Card className="overflow-hidden">
        <div className="flex items-center justify-between gap-3 px-4 py-3">
          <div className="min-w-0">
            <p className="eyebrow text-azure first-letter:uppercase">{mesLargo(mes)}</p>
            <p className="mt-0.5 font-display text-[13.5px] font-semibold">
              <span className="text-[24px] leading-none tnum">{acts.length}</span>
              <span className="text-ink2"> actividades · {totalEv} evidencias</span>
            </p>
          </div>
          <button onClick={() => setVerTodo(true)} className="flex-none rounded-xl border border-line2 px-3 py-2 text-center hover:bg-surface2">
            <div className="font-display text-[20px] font-bold leading-none tnum text-azure">{global}%</div>
            <div className="text-[10.5px] text-ink3">avance</div>
          </button>
        </div>
        <div className="flex gap-1.5 overflow-x-auto px-4 pb-3.5" style={{ scrollbarWidth:'thin' }}>
          {filas.map(({ o, sub, e }) => (
            <button key={o.id} onClick={() => setDetalle({ o, sub, e })}
              className="flex flex-none items-center gap-1.5 rounded-full border border-line2 bg-surface px-2.5 py-1.5 hover:bg-surface2">
              <span className={cx('h-2 w-2 rounded-full', SEM[e.k].dot)} />
              <span className="font-mono text-[11.5px] tnum text-ink2">{o.cod}</span>
              <span className="font-mono text-[11px] tnum text-ink3">{sub.length}/{o.meta}</span>
            </button>
          ))}
          <button onClick={() => setVerTodo(true)} className="flex flex-none items-center gap-1 rounded-full border border-azure/40 bg-azuresoft px-2.5 py-1.5 font-display text-[11.5px] font-semibold text-azure">
            Ver todo <Icon n="chevron-right" s={13} />
          </button>
        </div>
      </Card>

      {(vencidos.length > 0 || enRojo.length > 0) && (
        <Card className="border-ambar/40 bg-ambarsoft/50 p-4">
          <div className="flex items-center gap-2">
            <Icon n="alert-triangle" s={17} className="text-ambar" />
            <h3 className="font-display text-[14px] font-bold">Requiere tu atención</h3>
          </div>
          <ul className="mt-2.5 space-y-1.5 text-[13px] leading-snug">
            {vencidos.slice(0,2).map(c => (
              <li key={c.id} className="flex gap-2">
                <span className="mt-1.5 h-1.5 w-1.5 flex-none rounded-full bg-rojo" />
                <span>Compromiso vencido el {fechaCorta(c.fecha)} — <strong>{c.entidad}</strong>: {c.descripcion}</span>
              </li>
            ))}
            {enRojo.length > 0 && (
              <li className="flex gap-2">
                <span className="mt-1.5 h-1.5 w-1.5 flex-none rounded-full bg-ambar" />
                <span>{enRojo.length === 1 ? 'La obligación' : 'Las obligaciones'} {enRojo.map(f => f.o.cod).join(', ')} {enRojo.length === 1 ? 'está' : 'están'} por debajo del 40% de la meta del mes.</span>
              </li>
            )}
          </ul>
        </Card>
      )}

      {feed.length === 0
        ? <Vacio icon="camera"
            titulo={st.actividades.length ? 'Sin registros este mes' : 'Tu bitácora está lista'}
            texto={st.actividades.length
              ? 'En este período no hay actividades capturadas. Cambia de mes arriba o registra una nueva.'
              : 'Toca el botón + y captura la primera evidencia: una foto o una nota dictada bastan. La fecha, la hora y la obligación vienen puestas.'}
            accion={<Boton icon="plus" onClick={() => ir('capturar')}>Capturar ahora</Boton>} />
        : <div className="space-y-3">
            <h3 className="eyebrow px-1 text-ink2">Evidencias capturadas</h3>
            {feed.map(a => {
              const evs = evDe(a);
              const fotos = evs.filter(e => e.tipo === 'foto' && e.dataUrl);
              return (
                <TarjetaActividad key={a.id} a={a} estado={porObligacion[a.obligacionId] || estadoSem(0,1)}
                  fotos={fotos} extras={evs.length - fotos.length}
                  onAbrir={() => setActividad(a)} onActa={() => abrirActa(a)} />
              );
            })}
          </div>}

      <Hoja abierta={verTodo} onCerrar={() => setVerTodo(false)} ancho="max-w-3xl"
            titulo="Semáforo de las 11 obligaciones" sub={`${mesLargo(mes)} · ${global}% de avance frente a las metas`}>
        <div className="mb-3 flex items-center gap-3 text-[11.5px] text-ink3">
          {[['verde','Cumplida'],['ambar','En avance'],['rojo','En riesgo']].map(([k,l]) => (
            <span key={k} className="flex items-center gap-1"><span className={cx('h-2 w-2 rounded-full', SEM[k].dot)} />{l}</span>
          ))}
        </div>
        <div className="grid gap-2 sm:grid-cols-2">
          {filas.map(({ o, sub, e, ev }) => (
            <button key={o.id} onClick={() => { setVerTodo(false); setDetalle({ o, sub, e }); }}
              className="rail w-full rounded-xl border border-line bg-surface p-3 pl-4 text-left transition hover:bg-surface2"
              style={{ '--rail':SEM[e.k].rail }}>
              <div className="flex items-start gap-3">
                <span className="mt-0.5 flex h-9 w-9 flex-none items-center justify-center rounded-lg bg-azuresoft text-azure"><Icon n={o.icon} s={17} /></span>
                <div className="min-w-0 flex-1">
                  <div className="flex items-center gap-2">
                    <span className="font-mono text-[11px] text-ink3">{o.cod}</span>
                    <Chip tone={e.k}>{e.label}</Chip>
                  </div>
                  <p className="mt-0.5 truncate font-display text-[14.5px] font-semibold">{o.corto}</p>
                  <div className="mt-2 flex items-center gap-2.5">
                    <Barra p={e.p} k={e.k} alto="h-1.5" />
                    <span className="flex-none font-mono text-[11.5px] tnum text-ink2">{sub.length}/{o.meta}</span>
                  </div>
                  <p className="mt-1.5 text-[11.5px] text-ink3">
                    {sub.length ? `Último registro: ${fechaCorta(sub[0].fecha)} · ${ev} evidencia${ev === 1 ? '' : 's'}` : 'Sin actividades este mes'}
                  </p>
                </div>
              </div>
            </button>
          ))}
        </div>
      </Hoja>

      <Hoja abierta={!!detalle} onCerrar={() => setDetalle(null)}
            titulo={detalle ? `${detalle.o.cod} · ${detalle.o.corto}` : ''} sub={detalle ? detalle.o.eje : ''}>
        {detalle && (
          <div className="space-y-3">
            <p className="rounded-xl border border-line bg-surface2 p-3 text-[13px] leading-relaxed text-ink2">{detalle.o.titulo}</p>
            <div className="flex items-center gap-3">
              <Barra p={detalle.e.p} k={detalle.e.k} />
              <span className="flex-none font-mono text-[12px] tnum">{detalle.e.p}%</span>
            </div>
            {detalle.sub.length === 0
              ? <Vacio icon="calendar-off" titulo="Sin actividades en el período" texto="Captura una evidencia para que esta obligación deje de estar en rojo."
                  accion={<Boton icon="plus" onClick={() => { const id = detalle.o.id; setDetalle(null); ir('capturar', { obligacionId:id }); }}>Capturar ahora</Boton>} />
              : detalle.sub.map(a => (
                <button key={a.id} onClick={() => { setDetalle(null); setActividad(a); }} className="w-full rounded-xl border border-line p-3 text-left hover:bg-surface2">
                  <div className="flex items-center justify-between gap-2">
                    <span className="font-mono text-[11.5px] text-ink3">{fechaCorta(a.fecha)} · {a.hora}</span>
                    <Chip>{(a.evidencias || []).length} evid.</Chip>
                  </div>
                  <p className="mt-1 font-display text-[14px] font-semibold leading-snug">{a.titulo}</p>
                </button>
              ))}
          </div>
        )}
      </Hoja>

      <Hoja abierta={!!editando} onCerrar={() => setEditando(null)} ancho="max-w-3xl"
            titulo="Editar actividad"
            sub={editando ? obl(editando.obligacionId).cod + ' · ' + fechaLarga(editando.fecha) : ''}
            pie={editando && (
              <div className="flex gap-2">
                <Boton icon="check" className="flex-1" onClick={() => guardarActividad(editando)}>Guardar cambios</Boton>
                <Boton variant="fantasma" onClick={() => setEditando(null)}>Cancelar</Boton>
              </div>
            )}>
        {editando && <EditorActividad actividad={editando} onChange={setEditando} />}
      </Hoja>

      <Hoja abierta={!!actividad} onCerrar={() => setActividad(null)}
            titulo={actividad ? actividad.titulo : ''}
            sub={actividad ? `${obl(actividad.obligacionId).cod} · ${fechaLarga(actividad.fecha)} · ${actividad.hora || ''}` : ''}>
        {actividad && (() => {
          const evs = evDe(actividad);
          const fotos = evs.filter(e => e.tipo === 'foto' && e.dataUrl);
          return (
            <div className="space-y-3">
              <div className="flex flex-wrap gap-1.5">
                <Chip tone="azure">{actividad.tipo}</Chip>
                {actividad.lugar && <Chip><Icon n="map-pin" s={11} />{actividad.lugar}</Chip>}
                {actividad.participantes > 0 && <Chip><Icon n="users" s={11} />{actividad.participantes}</Chip>}
                {actividad.radicado && <Chip tone="fucsia">{actividad.radicado}</Chip>}
              </div>
              {fotos.length > 0 && (
                <div className="grid grid-cols-2 gap-2">
                  {fotos.map(e => (
                    <figure key={e.id} className="relative overflow-hidden rounded-xl border border-line">
                      <img src={e.dataUrl} alt={e.nombre} className="h-32 w-full object-cover" />
                      <button onClick={() => borrarEvidencia(e, actividad.id)} aria-label={'Eliminar ' + e.nombre}
                        className="absolute right-1.5 top-1.5 rounded-full bg-ink/70 p-1.5 text-paper">
                        <Icon n="trash-2" s={13} />
                      </button>
                      <figcaption className="px-2 py-1.5 text-[11px] text-ink3">{e.nombre}</figcaption>
                    </figure>
                  ))}
                </div>
              )}
              <div>
                <p className="eyebrow mb-1 text-ink2">Redacción institucional</p>
                <p className="rounded-xl border border-line bg-surface p-3 text-[13.5px] leading-relaxed">{actividad.descripcion}</p>
              </div>
              {actividad.notaCruda && (
                <div>
                  <p className="eyebrow mb-1 text-ink2">Nota de campo original</p>
                  <p className="rounded-xl border border-dashed border-line2 p-3 text-[13px] italic leading-relaxed text-ink3">«{actividad.notaCruda}»</p>
                </div>
              )}
              <div className="flex flex-wrap gap-2 border-t border-line pt-3">
                <Boton icon="pencil" variant="linea" className="flex-1"
                  onClick={() => { const a = actividad; setActividad(null); setEditando({ ...a }); }}>Editar</Boton>
                <Boton icon="file-plus" className="flex-1" onClick={() => { const a = actividad; setActividad(null); abrirActa(a); }}>Crear acta</Boton>
                <Boton icon="trash-2" variant="linea" onClick={() => borrarActividad(actividad)}>Eliminar</Boton>
              </div>
              <p className="text-center text-[11.5px] text-ink3">Al eliminar queda unos segundos el botón «Deshacer».</p>
            </div>
          );
        })()}
      </Hoja>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════════
   8.b EDITOR DE ACTIVIDAD — corregir lo ya guardado.
       Marcar mal la obligación o equivocarse en la fecha es normal;
       lo que no puede ser es que no haya vuelta atrás.
   ══════════════════════════════════════════════════════════════════ */
function EditorActividad({ actividad, onChange }){
  const { st, toast } = useApp();
  const [cargando, setCargando] = useState(false);
  const fotoRef = useRef(null);
  const a = actividad;
  const set = (k, v) => onChange({ ...a, [k]:v });

  const fotos = st.evidencias.filter(e => (a.evidencias || []).includes(e.id));
  const nuevas = a._nuevasFotos || [];

  async function agregarFotos(lista){
    setCargando(true);
    const puestas = [];
    for (const file of Array.from(lista).slice(0,8)){
      if (!file.type.startsWith('image/')) continue;
      const r = await comprimirImagen(file);
      puestas.push({ id:uid('ev'), nombre:'Registro fotográfico', descripcion:'', tipo:'foto',
        dataUrl:r ? r.dataUrl : null, creadoEn:new Date().toISOString() });
    }
    onChange({ ...a, _nuevasFotos:[...nuevas, ...puestas] });
    setCargando(false);
  }

  function volverARedactar(){
    if (!(a.notaCruda || '').trim()){
      toast('No hay nota de campo de la cual partir.', 'ambar');
      return;
    }
    onChange({ ...a, descripcion:redactarInstitucional(a.notaCruda, {
      obligacionId:a.obligacionId, tipo:a.tipo, fecha:a.fecha, lugar:a.lugar,
      participantes:Number(a.participantes) || 0,
      evidencias:(a.evidencias || []).length + nuevas.length, instancia:a.instancia }) });
    toast('Texto vuelto a redactar con los datos corregidos.', 'verde');
  }

  return (
    <div className="space-y-4">
      <div>
        <h3 className="eyebrow mb-2 px-1 text-ink2">Obligación</h3>
        <div className="grid grid-cols-2 gap-2 sm:grid-cols-3">
          {OBLIGACIONES.map(x => {
            const activo = Number(a.obligacionId) === x.id;
            return (
              <button key={x.id} onClick={() => set('obligacionId', x.id)}
                className={cx('flex min-h-[72px] flex-col justify-between rounded-xl border-2 p-2.5 text-left transition',
                  activo ? 'border-azure bg-azuresoft' : 'border-line bg-surface hover:bg-surface2')}>
                <Icon n={x.icon} s={17} className={activo ? 'text-azure' : 'text-ink3'} />
                <div>
                  <span className={cx('font-mono text-[10.5px]', activo ? 'text-azure' : 'text-ink3')}>{x.cod}</span>
                  <p className={cx('font-display text-[12px] font-semibold leading-tight', activo ? 'text-azure' : 'text-ink')}>{x.corto}</p>
                </div>
              </button>
            );
          })}
        </div>
      </div>

      <Campo label="Título">
        <input className="fld" id="ea-titulo" value={a.titulo || ''} onChange={e => set('titulo', e.target.value)} />
      </Campo>

      <div className="grid gap-3 sm:grid-cols-2">
        <Campo label="Tipo de actividad">
          <select className="fld" id="ea-tipo" value={a.tipo || TIPOS[0]} onChange={e => set('tipo', e.target.value)}>
            {TIPOS.map(t => <option key={t}>{t}</option>)}
          </select>
        </Campo>
        <Campo label="Instancia">
          <input className="fld" id="ea-instancia" value={a.instancia || ''} onChange={e => set('instancia', e.target.value)} placeholder="Comité Municipal de…" />
        </Campo>
        <Campo label="Fecha"><input type="date" className="fld" id="ea-fecha" value={a.fecha} onChange={e => set('fecha', e.target.value)} /></Campo>
        <Campo label="Hora"><input type="time" className="fld" id="ea-hora" value={a.hora || ''} onChange={e => set('hora', e.target.value)} /></Campo>
        <Campo label="Lugar"><input className="fld" id="ea-lugar" value={a.lugar || ''} onChange={e => set('lugar', e.target.value)} /></Campo>
        <Campo label="Participantes">
          <input type="number" min="0" className="fld tnum" id="ea-part" value={a.participantes || 0} onChange={e => set('participantes', Number(e.target.value) || 0)} />
        </Campo>
      </div>

      <Campo label="Radicado" hint="PQRS, UNP o alerta, cuando aplique.">
        <input className="fld" id="ea-radicado" value={a.radicado || ''} onChange={e => set('radicado', e.target.value)} placeholder="2026-EE-0000" />
      </Campo>

      <Campo label="Nota de campo original" hint="Se conserva como respaldo de lo que dijiste en campo.">
        <textarea rows={2} className="fld resize-y text-[13.5px]" id="ea-nota" value={a.notaCruda || ''} onChange={e => set('notaCruda', e.target.value)} />
      </Campo>

      <div>
        <Campo label="Texto institucional" hint="Es lo que sale impreso en el acta y en el informe.">
          <textarea rows={6} className="fld resize-y leading-relaxed" id="ea-desc" value={a.descripcion || ''} onChange={e => set('descripcion', e.target.value)} />
        </Campo>
        <Boton icon="wand-2" variant="fucsia" className="mt-2 w-full" onClick={volverARedactar}>Volver a redactar</Boton>
        <p className="mt-1.5 text-[11.5px] leading-snug text-ink3">
          Rehace el texto desde la nota de campo con la obligación, la fecha y el lugar que tengas puestos ahora.
          Pierdes los ajustes que hayas escrito a mano.
        </p>
      </div>

      <div>
        <div className="mb-2 flex items-center justify-between px-1">
          <h3 className="eyebrow text-ink2">Evidencias</h3>
          <button onClick={() => fotoRef.current.click()} className="inline-flex items-center gap-1.5 font-display text-[12px] font-semibold text-azure">
            <Icon n="camera" s={14} /> Agregar fotos
          </button>
        </div>
        <input ref={fotoRef} id="ea-fotos" type="file" accept="image/*" capture="environment" multiple hidden
               onChange={e => { agregarFotos(e.target.files); e.target.value = ''; }} />
        {cargando && <p className="px-1 text-[12.5px] text-ink3">Comprimiendo…</p>}
        {(fotos.length + nuevas.length) === 0
          ? <p className="rounded-xl border border-dashed border-line2 px-4 py-5 text-center text-[13px] text-ink3">Esta actividad no tiene evidencias.</p>
          : <div className="grid grid-cols-3 gap-2 sm:grid-cols-4">
              {fotos.map(e => (
                <figure key={e.id} className="overflow-hidden rounded-xl border border-line">
                  {e.dataUrl
                    ? <img src={e.dataUrl} alt={e.nombre} className="h-20 w-full object-cover" />
                    : <div className="flex h-20 items-center justify-center bg-surface2 text-ink3"><Icon n="file-text" s={20} /></div>}
                  <figcaption className="truncate px-1.5 py-1 text-[10px] text-ink3">{e.nombre}</figcaption>
                </figure>
              ))}
              {nuevas.map(e => (
                <figure key={e.id} className="relative overflow-hidden rounded-xl border-2 border-verde">
                  <img src={e.dataUrl} alt={e.nombre} className="h-20 w-full object-cover" />
                  <button onClick={() => onChange({ ...a, _nuevasFotos:nuevas.filter(x => x.id !== e.id) })}
                    aria-label="Quitar foto nueva" className="absolute right-1 top-1 rounded-full bg-ink/70 p-1 text-paper">
                    <Icon n="x" s={11} />
                  </button>
                  <figcaption className="truncate bg-verdesoft px-1.5 py-1 text-[10px] font-semibold text-verde">Nueva</figcaption>
                </figure>
              ))}
            </div>}
        <p className="mt-1.5 text-[11.5px] leading-snug text-ink3">
          Para borrar una evidencia que ya estaba, ciérra esto y usa la papelera de la foto en el detalle: así queda el botón Deshacer.
        </p>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════════
   9. PANTALLA · CAPTURA RÁPIDA
      Voz y cámara primero. Escribir es opcional: la fecha, la hora y la
      obligación más frecuente vienen puestas, y el resto se elige con
      tarjetas y chips. Tres toques: (+) → Grabar o Foto → Guardar.
   ══════════════════════════════════════════════════════════════════ */
function BotonGigante({ icon, titulo, sub, tono = 'azure', activo, ...p }){
  const t = activo
    ? 'border-fucsia bg-fucsia text-paper'
    : tono === 'fucsia'
      ? 'border-fucsia/40 bg-fucsiasoft text-fucsia hover:brightness-105'
      : 'border-azure/40 bg-azuresoft text-azure hover:brightness-105';
  return (
    <button {...p} className={cx('flex min-h-[124px] flex-1 flex-col items-center justify-center gap-2 rounded-2xl border-2 px-3 py-4 transition active:scale-[0.98]', t)}>
      <Icon n={icon} s={34} stroke={1.6} className={activo ? 'rec' : ''} />
      <span className="font-display text-[15px] font-bold leading-none">{titulo}</span>
      <span className="text-[11.5px] leading-tight opacity-80">{sub}</span>
    </button>
  );
}

const ChipSel = ({ activo, children, ...p }) => (
  <button {...p} className={cx('rounded-xl border px-3 py-2.5 text-left font-display text-[13px] font-semibold transition',
    activo ? 'border-azure bg-azure text-paper' : 'border-line2 bg-surface text-ink2 hover:bg-surface2')}>
    {children}
  </button>
);

function Capturar({ prefill, limpiarPrefill }){
  const { st, setSt, toast, ir } = useApp();

  const sugerido = useMemo(() => sugerirContexto(st.actividades), [st.actividades]);
  const nuevoForm = useCallback((base) => ({
    obligacionId: sugerido.obligacionId,
    tipo: sugerido.tipo,
    instancia: sugerido.instancia,
    lugar: sugerido.lugar,
    titulo:'', fecha:hoyISO(), hora:new Date().toTimeString().slice(0,5),
    participantes:0, radicado:'', notaCruda:'', descripcion:'',
    ...(base || {})
  }), [sugerido]);

  const [f, setF] = useState(nuevoForm);
  const [evs, setEvs] = useState([]);
  const [grabando, setGrabando] = useState(false);
  const [parcial, setParcial] = useState('');
  const [cargando, setCargando] = useState(false);
  const [detalles, setDetalles] = useState(false);
  const [lugarLibre, setLugarLibre] = useState(false);
  const [destino, setDestino] = useState(false);

  const recRef = useRef(null);
  const baseRef = useRef('');
  const fRef = useRef(f); fRef.current = f;
  const evsRef = useRef(evs); evsRef.current = evs;
  const fotoRef = useRef(null);
  const docRef = useRef(null);

  const soportaVoz = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
  const up = (k,v) => setF(p => ({ ...p, [k]:v }));
  const o = obl(f.obligacionId);
  const espacios = useMemo(() => instanciasFrecuentes(st.actividades, f.obligacionId), [st.actividades, f.obligacionId]);
  const lugares = useMemo(() => lugaresFrecuentes(st.actividades, f.obligacionId), [st.actividades, f.obligacionId]);

  useEffect(() => {
    if (!prefill) return;
    setF(p => ({ ...p, ...prefill }));
    limpiarPrefill();
  }, [prefill]);

  useEffect(() => () => { try{ recRef.current && recRef.current.abort(); }catch(e){} }, []);

  function redactarDesde(estado, lista){
    return redactarInstitucional(estado.notaCruda, {
      obligacionId:estado.obligacionId, tipo:estado.tipo, fecha:estado.fecha, lugar:estado.lugar,
      participantes:Number(estado.participantes) || 0, evidencias:(lista || []).length, instancia:estado.instancia
    });
  }

  /* ── Voz ─────────────────────────────────────────────────────────
     continuous:false — el dictado se cierra solo con la pausa, así el
     tercer toque es Guardar y no «detener». */
  function alternarVoz(){
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR){ setDetalles(true); toast('Este navegador no dicta; escribe la nota en Más detalles.', 'ambar'); return; }
    if (grabando){ try{ recRef.current && recRef.current.stop(); }catch(e){} return; }
    try{
      const r = new SR();
      r.lang = 'es-CO'; r.continuous = false; r.interimResults = true;
      baseRef.current = f.notaCruda;
      r.onresult = e => {
        let fin = '', prov = '';
        for (let i = 0; i < e.results.length; i++){
          const t = e.results[i][0].transcript;
          if (e.results[i].isFinal) fin += t + ' '; else prov += t;
        }
        setParcial(prov);
        if (fin) setF(p => ({ ...p, notaCruda:(baseRef.current + ' ' + fin).trim() }));
      };
      r.onerror = ev => {
        setGrabando(false); setParcial('');
        const err = ev && ev.error;
        // Micrófono denegado o navegador sin servicio de dictado (Brave, Firefox):
        // se abre el campo de texto para que la captura no se quede bloqueada.
        if (err === 'not-allowed' || err === 'service-not-allowed'){
          setDetalles(true);
          toast('Sin micrófono aquí. Escribe la nota abajo: se redacta igual.', 'ambar');
        } else if (err && err !== 'aborted' && err !== 'no-speech'){
          setDetalles(true);
          toast('No se pudo capturar el audio. Escribe la nota abajo.', 'ambar');
        }
      };
      r.onend = () => {
        setGrabando(false); setParcial('');
        setTimeout(() => {
          const estado = fRef.current;
          if (!estado.notaCruda.trim()) return;
          setF(p => ({ ...p, descripcion:redactarDesde(estado, evsRef.current) }));
          toast('Nota dictada y redactada. Revisa y guarda.', 'verde');
        }, 60);
      };
      recRef.current = r; r.start(); setGrabando(true);
    }catch(e){ toast('No se pudo iniciar el dictado.', 'rojo'); }
  }

  /* ── Cámara y adjuntos ───────────────────────────────────────── */
  async function agregarArchivos(lista, tipo){
    setCargando(true);
    const nuevos = [];
    for (const file of Array.from(lista).slice(0,8)){
      if (tipo === 'foto' && file.type.startsWith('image/')){
        const r = await comprimirImagen(file);
        nuevos.push({ id:uid('ev'), nombre:'Registro fotográfico', descripcion:'', tipo:'foto',
          dataUrl:r ? r.dataUrl : null, creadoEn:new Date().toISOString() });
      } else {
        nuevos.push({ id:uid('ev'), nombre:file.name.slice(0,70), descripcion:Math.round(file.size/1024) + ' KB',
          tipo:file.type.includes('pdf') ? 'pdf' : 'archivo', dataUrl:null, creadoEn:new Date().toISOString() });
      }
    }
    setEvs(p => [...p, ...nuevos]);
    setCargando(false);
    if (nuevos.length) toast(`${nuevos.length} evidencia${nuevos.length === 1 ? '' : 's'} lista${nuevos.length === 1 ? '' : 's'}. Toca Guardar.`, 'verde');
  }

  function guardar(){
    if (!f.notaCruda.trim() && !evs.length && !f.titulo.trim()){
      toast('Graba una nota o toma una foto antes de guardar.', 'ambar');
      return;
    }
    const descripcion = f.descripcion.trim() || redactarDesde(f, evs);
    const act = {
      id:uid('act'), obligacionId:Number(f.obligacionId), tipo:f.tipo, instancia:f.instancia,
      titulo:f.titulo.trim() || (f.instancia ? f.instancia : `${f.tipo} — ${fechaCorta(f.fecha)}`),
      fecha:f.fecha, hora:f.hora, lugar:f.lugar, participantes:Number(f.participantes) || 0,
      radicado:f.radicado, notaCruda:f.notaCruda, descripcion,
      evidencias:evs.map(e => e.id), creadoEn:new Date().toISOString()
    };
    setSt(p => ({ ...p,
      actividades:[act, ...p.actividades],
      evidencias:[...p.evidencias, ...evs.map(e => ({ ...e, actividadId:act.id }))] }));
    setF(nuevoForm()); setEvs([]); setDetalles(false); setLugarLibre(false); setDestino(false);
    toast(`Registrado en ${obl(act.obligacionId).cod}. Ya cuenta en el semáforo.`, 'verde');
    ir('inicio');
  }

  const listo = !!(f.notaCruda.trim() || evs.length || f.titulo.trim());

  return (
    <div className="space-y-4">
      {/* Todo lo que la app ya decidió por ti, en una sola línea */}
      <div className="flex items-center gap-3 rounded-xl border border-line bg-surface2 px-3.5 py-3">
        <span className="flex h-10 w-10 flex-none items-center justify-center rounded-lg bg-surface text-azure">
          <Icon n={o.icon} s={19} />
        </span>
        <div className="min-w-0 flex-1">
          <p className="truncate font-display text-[13.5px] font-semibold">
            <span className="font-mono text-[11.5px] text-ink3">{o.cod}</span> {o.corto}
          </p>
          <p className="mt-0.5 truncate text-[11.5px] text-ink3">
            {fechaRelativa(f.fecha)}, {f.hora}
            {f.lugar ? ' · ' + f.lugar : ''}
            {Number(f.participantes) > 0 ? ' · ' + f.participantes + ' personas' : ''}
          </p>
        </div>
        <button onClick={() => setDestino(v => !v)}
          className="flex-none rounded-lg border border-line2 bg-surface px-2.5 py-1.5 font-display text-[12px] font-semibold text-azure">
          {destino ? 'Listo' : 'Cambiar'}
        </button>
      </div>

      {/* Los dos botones que importan */}
      <div className="flex gap-2.5">
        <BotonGigante icon={grabando ? 'square' : 'mic'} tono="fucsia" activo={grabando}
          titulo={grabando ? 'Escuchando…' : 'Grabar nota'}
          sub={grabando ? 'Termina al hacer pausa' : soportaVoz ? 'Dicta y se redacta sola' : 'Aquí no hay dictado: toca para escribir'}
          onClick={alternarVoz} aria-pressed={grabando} />
        <BotonGigante icon="camera" titulo="Tomar foto" sub={evs.length ? `${evs.length} en esta captura` : 'Acta, asistencia, evento'}
          onClick={() => fotoRef.current.click()} />
      </div>
      <input ref={fotoRef} id="cap-fotos" type="file" accept="image/*" capture="environment" multiple hidden
             onChange={e => { agregarArchivos(e.target.files, 'foto'); e.target.value = ''; }} />
      <input ref={docRef} id="cap-docs" type="file" accept=".pdf,.doc,.docx,.xlsx,image/*" multiple hidden
             onChange={e => { agregarArchivos(e.target.files, 'doc'); e.target.value = ''; }} />

      {(grabando || parcial) && (
        <div className="rounded-xl border border-fucsia/40 bg-fucsiasoft px-3.5 py-3">
          <p className="eyebrow text-fucsia">Escuchando</p>
          <p className="mt-1 text-[13.5px] leading-relaxed text-ink">{f.notaCruda} <span className="text-ink3">{parcial}</span></p>
        </div>
      )}

      {cargando && <p className="px-1 text-[12.5px] text-ink3">Comprimiendo fotos…</p>}

      {evs.length > 0 && (
        <div className="flex gap-2 overflow-x-auto pb-1" style={{ scrollbarWidth:'thin' }}>
          {evs.map(e => (
            <div key={e.id} className="relative h-20 w-20 flex-none overflow-hidden rounded-xl border border-line bg-surface2">
              {e.dataUrl
                ? <img src={e.dataUrl} alt={e.nombre} className="h-full w-full object-cover" />
                : <div className="flex h-full w-full items-center justify-center text-ink3"><Icon n="file-text" s={22} /></div>}
              <button onClick={() => setEvs(p => p.filter(x => x.id !== e.id))} aria-label="Quitar evidencia"
                className="absolute right-1 top-1 rounded-full bg-ink/70 p-1 text-paper"><Icon n="x" s={12} /></button>
            </div>
          ))}
          <button onClick={() => docRef.current.click()}
            className="flex h-20 w-20 flex-none flex-col items-center justify-center gap-1 rounded-xl border border-dashed border-line2 text-ink3 hover:bg-surface2">
            <Icon n="paperclip" s={18} /><span className="text-[10.5px]">PDF</span>
          </button>
        </div>
      )}

      {f.descripcion && (
        <div className="rounded-xl border border-verde/30 bg-verdesoft px-3.5 py-3">
          <div className="flex items-center gap-1.5">
            <Icon n="check-circle" s={15} className="text-verde" />
            <p className="eyebrow text-verde">Texto institucional listo</p>
          </div>
          <p className="mt-1.5 text-[13px] leading-relaxed text-ink2"
             style={{ display:'-webkit-box', WebkitLineClamp:3, WebkitBoxOrient:'vertical', overflow:'hidden' }}>
            {f.descripcion}
          </p>
          <button onClick={() => setDetalles(true)} className="mt-1.5 font-display text-[12px] font-semibold text-verde">Ver y ajustar</button>
        </div>
      )}

      {/* Se despliega solo si hay que corregir lo que la app supuso */}
      {destino && (
      <div className="space-y-4 anim-in">
      <div>
        <div className="mb-2 px-1">
          <h3 className="eyebrow text-ink2">¿A qué obligación cuenta?</h3>
          <p className="mt-0.5 text-[11px] leading-snug text-ink3">Viene marcada la sugerida: {sugerido.razon}.</p>
        </div>
        <div className="grid grid-cols-2 gap-2 sm:grid-cols-3">
          {OBLIGACIONES.map(x => {
            const activo = Number(f.obligacionId) === x.id;
            const esSugerida = sugerido.obligacionId === x.id;
            return (
              <button key={x.id} onClick={() => setF(p => ({ ...p, obligacionId:x.id, instancia:'', lugar:p.lugar }))}
                className={cx('relative flex min-h-[86px] flex-col justify-between rounded-xl border-2 p-2.5 text-left transition active:scale-[0.98]',
                  activo ? 'border-azure bg-azuresoft' : 'border-line bg-surface hover:bg-surface2')}>
                {esSugerida && !activo && (
                  <span className="absolute right-1.5 top-1.5 rounded-full bg-fucsiasoft px-1.5 py-0.5 font-display text-[9px] font-bold uppercase tracking-wide text-fucsia">Sugerida</span>
                )}
                <Icon n={x.icon} s={19} className={activo ? 'text-azure' : 'text-ink3'} />
                <div>
                  <span className={cx('font-mono text-[10.5px]', activo ? 'text-azure' : 'text-ink3')}>{x.cod}</span>
                  <p className={cx('font-display text-[12.5px] font-semibold leading-tight', activo ? 'text-azure' : 'text-ink')}>{x.corto}</p>
                </div>
              </button>
            );
          })}
        </div>
      </div>

      {espacios.length > 0 && (
        <div>
          <h3 className="eyebrow mb-2 px-1 text-ink2">Espacio o instancia</h3>
          <div className="grid gap-1.5">
            {espacios.map(v => (
              <ChipSel key={v} activo={f.instancia === v}
                onClick={() => setF(p => ({ ...p, instancia:p.instancia === v ? '' : v, titulo:p.titulo || `Sesión de ${v}` }))}>
                {v}
              </ChipSel>
            ))}
          </div>
        </div>
      )}

      <div>
        <h3 className="eyebrow mb-2 px-1 text-ink2">Tipo de actividad</h3>
        <div className="flex flex-wrap gap-1.5">
          {TIPOS.map(t => (
            <button key={t} onClick={() => up('tipo', t)}
              className={cx('rounded-full border px-3 py-2 text-[12.5px] font-medium transition',
                f.tipo === t ? 'border-azure bg-azure text-paper' : 'border-line2 bg-surface text-ink2 hover:bg-surface2')}>
              {t}
            </button>
          ))}
        </div>
      </div>

      <div>
        <h3 className="eyebrow mb-2 px-1 text-ink2">Lugar</h3>
        <div className="flex flex-wrap gap-1.5">
          {lugares.map(l => (
            <button key={l} onClick={() => { up('lugar', f.lugar === l ? '' : l); setLugarLibre(false); }}
              className={cx('rounded-full border px-3 py-2 text-[12.5px] font-medium transition',
                f.lugar === l ? 'border-azure bg-azure text-paper' : 'border-line2 bg-surface text-ink2 hover:bg-surface2')}>
              {l}
            </button>
          ))}
          <button onClick={() => setLugarLibre(v => !v)}
            className={cx('rounded-full border px-3 py-2 text-[12.5px] font-medium transition',
              lugarLibre ? 'border-azure bg-azuresoft text-azure' : 'border-dashed border-line2 bg-surface text-ink3')}>
            Otro lugar
          </button>
        </div>
        {lugarLibre && (
          <input className="fld mt-2" id="cap-lugar" value={f.lugar} onChange={e => up('lugar', e.target.value)}
                 placeholder="Vereda, institución, plataforma…" />
        )}
      </div>

      <div>
        <h3 className="eyebrow mb-2 px-1 text-ink2">Participantes</h3>
        <div className="flex items-center gap-2">
          <button onClick={() => up('participantes', Math.max(0, Number(f.participantes) - 1))} aria-label="Menos participantes"
            className="flex h-11 w-11 flex-none items-center justify-center rounded-xl border border-line2 bg-surface text-ink2"><Icon n="minus" s={18} /></button>
          <div className="flex h-11 min-w-[64px] flex-none items-center justify-center rounded-xl border border-line2 bg-surface px-3 font-display text-[18px] font-bold tnum">
            {Number(f.participantes) || 0}
          </div>
          <button onClick={() => up('participantes', Number(f.participantes) + 1)} aria-label="Más participantes"
            className="flex h-11 w-11 flex-none items-center justify-center rounded-xl border border-line2 bg-surface text-ink2"><Icon n="plus" s={18} /></button>
          <div className="flex flex-1 flex-wrap gap-1.5">
            {[5,10,15,20,30].map(n => (
              <button key={n} onClick={() => up('participantes', n)}
                className={cx('rounded-full border px-3 py-2 font-mono text-[12.5px] tnum transition',
                  Number(f.participantes) === n ? 'border-azure bg-azure text-paper' : 'border-line2 bg-surface text-ink2')}>
                {n}
              </button>
            ))}
          </div>
        </div>
      </div>

      </div>
      )}

      <button onClick={() => setDetalles(v => !v)}
        className="flex w-full items-center justify-between rounded-xl border border-line bg-surface px-3.5 py-3 text-left">
        <span className="font-display text-[13.5px] font-semibold">Más detalles <span className="font-normal text-ink3">— título, radicado, texto</span></span>
        <Icon n={detalles ? 'chevron-up' : 'chevron-down'} s={18} className="text-ink3" />
      </button>

      {detalles && (
        <Card className="space-y-3 p-4 anim-in">
          <Campo label="Título de la actividad" hint="Si lo dejas vacío, la app usa la instancia o el tipo y la fecha.">
            <input className="fld" id="cap-titulo" value={f.titulo} onChange={e => up('titulo', e.target.value)} placeholder="Sesión ordinaria del Comité…" />
          </Campo>
          <div className="grid gap-3 sm:grid-cols-2">
            <Campo label="Fecha"><input type="date" className="fld" id="cap-fecha" value={f.fecha} onChange={e => up('fecha', e.target.value)} /></Campo>
            <Campo label="Hora"><input type="time" className="fld" id="cap-hora" value={f.hora} onChange={e => up('hora', e.target.value)} /></Campo>
          </div>
          <Campo label="Instancia" hint="Nombre oficial del comité, consejo o mesa.">
            <input className="fld" id="cap-instancia" value={f.instancia} onChange={e => up('instancia', e.target.value)} placeholder="Comité Municipal de…" />
          </Campo>
          <Campo label="Radicado" hint="PQRS, UNP o alerta, cuando aplique.">
            <input className="fld" id="cap-radicado" value={f.radicado} onChange={e => up('radicado', e.target.value)} placeholder="2026-EE-0000" />
          </Campo>
          <Campo label="Nota de campo">
            <textarea rows={3} className="fld resize-y leading-relaxed" id="cap-nota" value={f.notaCruda} onChange={e => up('notaCruda', e.target.value)}
              placeholder="reunimos el comité, revisamos el plan y quedamos en que salud manda el informe antes del 30" />
          </Campo>
          <Boton icon="wand-2" variant="fucsia" className="w-full"
            onClick={() => {
              if (!f.notaCruda.trim()){ toast('Dicta o escribe primero la nota de campo.', 'ambar'); return; }
              setF(p => ({ ...p, descripcion:redactarDesde(f, evs) }));
              toast('Nota convertida a redacción institucional.', 'verde');
            }}>Redactar institucional</Boton>
          {f.descripcion && (
            <Campo label="Texto que entra al acta y al informe">
              <textarea rows={6} className="fld resize-y leading-relaxed" id="cap-desc" value={f.descripcion} onChange={e => up('descripcion', e.target.value)} />
            </Campo>
          )}
        </Card>
      )}

      {/* Tercer toque, siempre a la vista */}
      <div className="sticky z-10 -mx-4 border-t border-line bg-paper/95 px-4 py-3 backdrop-blur"
           style={{ bottom:'calc(72px + env(safe-area-inset-bottom, 0px))' }}>
        <button onClick={guardar} disabled={!listo}
          className={cx('flex w-full items-center justify-center gap-2.5 rounded-2xl px-4 py-4 font-display text-[16px] font-bold transition active:scale-[0.99]',
            listo ? 'bg-azure text-paper' : 'bg-surface2 text-ink3')}>
          <Icon n="check" s={22} />
          Guardar en {o.cod}
          {evs.length > 0 && <span className="rounded-full bg-paper/25 px-2 py-0.5 font-mono text-[12px]">{evs.length}</span>}
        </button>
        {!listo && <p className="mt-1.5 text-center text-[11.5px] text-ink3">Graba una nota o toma una foto para habilitar el guardado.</p>}
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════════
   10. PANTALLA · ACTAS
   ══════════════════════════════════════════════════════════════════ */
const ORDEN_BASE = [
  'Verificación del quórum e instalación de la sesión',
  'Lectura y aprobación del orden del día',
  'Seguimiento a compromisos de la sesión anterior',
  'Desarrollo del tema central',
  'Proposiciones y varios'
];

function actaNueva(st, base){
  const anio = hoyISO().slice(0,4);
  const n = st.actas.filter(a => (a.fecha||'').slice(0,4) === anio).length + 1;
  const orden = ORDEN_BASE.slice();
  return {
    id:uid('acta'), consecutivo:String(n).padStart(3,'0'),
    obligacionId:base ? base.obligacionId : 1,
    instancia:base ? (base.instancia || base.titulo) : '',
    fecha:base ? base.fecha : hoyISO(),
    horaInicio:base ? (base.hora || '08:00') : '08:00', horaFin:'10:00',
    lugar:base ? base.lugar : '', modalidad:'Presencial',
    convoca:st.config.secretaria,
    objetivo:base ? (base.descripcion || '').split('. ').slice(0,1).join('. ') + '.' : '',
    ordenDia:orden,
    desarrollo:orden.map((_,i) => ({ punto:i+1, texto:i === 3 && base ? base.descripcion : '' })),
    compromisos:[], asistentes:[],
    conclusiones:'La sesión se desarrolló en el marco del reglamento interno de la instancia. Se levanta la sesión en la hora señalada.',
    evidencias:base ? (base.evidencias || []).slice() : [],
    elaboradaPor:st.config.contratista, creadaEn:hoyISO()
  };
}

function EditorActa({ acta, onChange }){
  const { st } = useApp();
  const a = acta;
  const setA = arg => onChange(typeof arg === 'function' ? arg(acta) : arg);
  const up = (k,v) => setA(p => ({ ...p, [k]:v }));

  const evsDisponibles = useMemo(() => {
    const ids = new Set(st.actividades.filter(x => x.fecha === a.fecha || x.obligacionId === Number(a.obligacionId)).flatMap(x => x.evidencias || []));
    return st.evidencias.filter(e => ids.has(e.id));
  }, [st.evidencias, st.actividades, a.fecha, a.obligacionId]);

  function setOrden(i, v){
    const orden = a.ordenDia.slice(); orden[i] = v;
    setA(p => ({ ...p, ordenDia:orden }));
  }
  function addPunto(){
    setA(p => ({ ...p, ordenDia:[...p.ordenDia, ''], desarrollo:[...p.desarrollo, { punto:p.ordenDia.length+1, texto:'' }] }));
  }
  function delPunto(i){
    setA(p => {
      const ordenDia = p.ordenDia.filter((_,k) => k !== i);
      const desarrollo = p.ordenDia
        .map((_,k) => ({ texto:(p.desarrollo[k] || {}).texto || '' }))
        .filter((_,k) => k !== i)
        .map((d,k) => ({ punto:k+1, texto:d.texto }));
      return { ...p, ordenDia, desarrollo };
    });
  }
  function setDesarrollo(i, texto){
    setA(p => {
      const d = p.ordenDia.map((_,k) => ({ punto:k+1, texto:(p.desarrollo[k] || {}).texto || '' }));
      d[i] = { punto:i+1, texto };
      return { ...p, desarrollo:d };
    });
  }
  function redactarPunto(i){
    const texto = (a.desarrollo[i] || {}).texto || '';
    if (!texto.trim()) return;
    setDesarrollo(i, redactarInstitucional(texto, { obligacionId:a.obligacionId, tipo:'Comité de política pública', fecha:a.fecha, lugar:a.lugar, instancia:a.instancia }));
  }
  const addFila = (k, obj) => setA(p => ({ ...p, [k]:[...(p[k]||[]), obj] }));
  const setFila = (k, id, campo, v) => setA(p => ({ ...p, [k]:p[k].map(x => x.id === id ? { ...x, [campo]:v } : x) }));
  const delFila = (k, id) => setA(p => ({ ...p, [k]:p[k].filter(x => x.id !== id) }));

  return (
    <div className="space-y-5">
      <div className="grid gap-3 sm:grid-cols-2">
        <Campo label="Acta N.º"><input className="fld tnum" id="ac-cons" value={a.consecutivo} onChange={e => up('consecutivo', e.target.value)} /></Campo>
        <Campo label="Obligación">
          <select className="fld" id="ac-obl" value={a.obligacionId} onChange={e => up('obligacionId', Number(e.target.value))}>
            {OBLIGACIONES.map(o => <option key={o.id} value={o.id}>{o.cod} — {o.corto}</option>)}
          </select>
        </Campo>
        <Campo label="Instancia" req className="sm:col-span-2">
          <input className="fld" id="ac-inst" value={a.instancia} onChange={e => up('instancia', e.target.value)} placeholder="Consejo Territorial de Paz…" />
        </Campo>
        <Campo label="Fecha"><input type="date" className="fld" id="ac-fecha" value={a.fecha} onChange={e => up('fecha', e.target.value)} /></Campo>
        <Campo label="Modalidad">
          <select className="fld" id="ac-mod" value={a.modalidad} onChange={e => up('modalidad', e.target.value)}>
            {['Presencial','Virtual','Mixta'].map(m => <option key={m}>{m}</option>)}
          </select>
        </Campo>
        <Campo label="Hora de inicio"><input type="time" className="fld" id="ac-hi" value={a.horaInicio} onChange={e => up('horaInicio', e.target.value)} /></Campo>
        <Campo label="Hora de cierre"><input type="time" className="fld" id="ac-hf" value={a.horaFin} onChange={e => up('horaFin', e.target.value)} /></Campo>
        <Campo label="Lugar"><input className="fld" id="ac-lugar" value={a.lugar} onChange={e => up('lugar', e.target.value)} /></Campo>
        <Campo label="Convoca"><input className="fld" id="ac-conv" value={a.convoca} onChange={e => up('convoca', e.target.value)} /></Campo>
      </div>

      <Campo label="Objetivo de la sesión">
        <textarea rows={2} className="fld resize-y" id="ac-obj" value={a.objetivo} onChange={e => up('objetivo', e.target.value)} />
      </Campo>

      <section>
        <div className="mb-2 flex items-center justify-between">
          <h3 className="eyebrow text-ink2">Orden del día y desarrollo</h3>
          <Boton icon="plus" variant="fantasma" onClick={addPunto}>Punto</Boton>
        </div>
        <div className="space-y-2.5">
          {a.ordenDia.map((p, i) => (
            <div key={i} className="rounded-xl border border-line bg-surface p-3">
              <div className="flex items-center gap-2">
                <span className="flex h-6 w-6 flex-none items-center justify-center rounded-md bg-azuresoft font-mono text-[11.5px] font-medium text-azure">{i+1}</span>
                <input className="min-w-0 flex-1 border-0 bg-transparent font-display text-[14px] font-semibold outline-none" value={p}
                  onChange={e => setOrden(i, e.target.value)} placeholder="Título del punto" />
                <button onClick={() => delPunto(i)} aria-label="Eliminar punto" className="text-ink3 hover:text-rojo"><Icon n="trash-2" s={15} /></button>
              </div>
              <textarea rows={2} className="fld mt-2 resize-y text-[13.5px] leading-relaxed"
                value={(a.desarrollo[i] || {}).texto || ''} onChange={e => setDesarrollo(i, e.target.value)}
                placeholder="Qué pasó en este punto. Escríbelo como salga: luego se convierte a lenguaje institucional." />
              <button onClick={() => redactarPunto(i)} className="mt-1.5 inline-flex items-center gap-1 text-[11.5px] font-semibold text-fucsia hover:underline">
                <Icon n="wand-2" s={13} /> Redactar institucional
              </button>
            </div>
          ))}
        </div>
      </section>

      <section>
        <div className="mb-2 flex items-center justify-between">
          <h3 className="eyebrow text-ink2">Compromisos</h3>
          <Boton icon="plus" variant="fantasma" onClick={() => addFila('compromisos', { id:uid('c'), descripcion:'', responsable:'', entidad:'', fecha:'', estado:'Pendiente' })}>Compromiso</Boton>
        </div>
        {(a.compromisos || []).length === 0
          ? <p className="rounded-xl border border-dashed border-line2 px-4 py-5 text-center text-[13px] text-ink3">Sin compromisos. Se imprime la nota «la sesión no generó compromisos».</p>
          : <div className="space-y-2">
              {a.compromisos.map((c,i) => (
                <div key={c.id} className="rounded-xl border border-line bg-surface p-3">
                  <div className="flex items-start gap-2">
                    <span className="mt-2 font-mono text-[11px] text-ink3">{i+1}</span>
                    <textarea rows={2} className="fld flex-1 resize-y text-[13.5px]" value={c.descripcion} placeholder="Compromiso adquirido"
                      onChange={e => setFila('compromisos', c.id, 'descripcion', e.target.value)} />
                    <button onClick={() => delFila('compromisos', c.id)} aria-label="Eliminar compromiso" className="mt-2 text-ink3 hover:text-rojo"><Icon n="trash-2" s={15} /></button>
                  </div>
                  <div className="mt-2 grid grid-cols-2 gap-2 sm:grid-cols-4">
                    <input className="fld text-[13px]" placeholder="Responsable" value={c.responsable} onChange={e => setFila('compromisos', c.id, 'responsable', e.target.value)} />
                    <input className="fld text-[13px]" placeholder="Entidad" value={c.entidad} onChange={e => setFila('compromisos', c.id, 'entidad', e.target.value)} />
                    <input type="date" className="fld text-[13px]" value={c.fecha} onChange={e => setFila('compromisos', c.id, 'fecha', e.target.value)} />
                    <select className="fld text-[13px]" value={c.estado} onChange={e => setFila('compromisos', c.id, 'estado', e.target.value)}>
                      {['Pendiente','En trámite','Cumplido'].map(x => <option key={x}>{x}</option>)}
                    </select>
                  </div>
                </div>
              ))}
            </div>}
      </section>

      <section>
        <div className="mb-2 flex items-center justify-between">
          <h3 className="eyebrow text-ink2">Asistentes</h3>
          <Boton icon="user-plus" variant="fantasma" onClick={() => addFila('asistentes', { id:uid('as'), nombre:'', cargo:'', entidad:'', contacto:'' })}>Asistente</Boton>
        </div>
        {(a.asistentes || []).length === 0
          ? <p className="rounded-xl border border-dashed border-line2 px-4 py-5 text-center text-[13px] text-ink3">Sin asistentes cargados: el acta remite a la planilla anexa.</p>
          : <div className="space-y-2">
              {a.asistentes.map(s => (
                <div key={s.id} className="grid grid-cols-2 gap-2 rounded-xl border border-line bg-surface p-2.5 sm:grid-cols-7">

                const on = (a.evidencias || []).includes(e.id);
                return (
                  <button key={e.id} onClick={() => up('evidencias', on ? a.evidencias.filter(x => x !== e.id) : [...(a.evidencias||[]), e.id])}
