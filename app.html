<title>Bitácora Territorial</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap">

<style>
  :root{
    --paper:243 244 241; --surface:255 255 255; --surface-2:236 238 234; --surface-3:227 231 226;
    --ink:20 30 28; --ink-2:74 87 84; --ink-3:124 136 132;
    --line:213 219 212; --line-2:196 204 195;
    --azure:14 90 120; --azure-soft:224 238 243;
    --fucsia:179 32 116; --fucsia-soft:250 230 242;
    --verde:17 122 84; --verde-soft:222 241 232;
    --ambar:176 118 12; --ambar-soft:250 238 213;
    --rojo:171 52 45; --rojo-soft:250 229 226;
    --shadow:16 26 24;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:13 17 17; --surface:22 28 28; --surface-2:31 39 38; --surface-3:41 51 50;
      --ink:231 236 233; --ink-2:165 177 173; --ink-3:126 139 135;
      --line:46 57 56; --line-2:62 76 74;
      --azure:108 188 220; --azure-soft:16 44 57;
      --fucsia:240 141 198; --fucsia-soft:57 19 43;
      --verde:75 200 148; --verde-soft:15 48 37;
      --ambar:231 177 62; --ambar-soft:53 40 12;
      --rojo:241 133 122; --rojo-soft:58 24 21;
      --shadow:0 0 0;
    }
  }
  :root[data-theme="dark"]{
    --paper:13 17 17; --surface:22 28 28; --surface-2:31 39 38; --surface-3:41 51 50;
    --ink:231 236 233; --ink-2:165 177 173; --ink-3:126 139 135;
    --line:46 57 56; --line-2:62 76 74;
    --azure:108 188 220; --azure-soft:16 44 57;
    --fucsia:240 141 198; --fucsia-soft:57 19 43;
    --verde:75 200 148; --verde-soft:15 48 37;
    --ambar:231 177 62; --ambar-soft:53 40 12;
    --rojo:241 133 122; --rojo-soft:58 24 21;
    --shadow:0 0 0;
  }

  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  html,body{height:100%}
  *{-webkit-tap-highlight-color:transparent}
  body{
    margin:0; background:rgb(var(--paper)); color:rgb(var(--ink));
    font-family:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
    overscroll-behavior-y:contain; touch-action:manipulation;
  }
  *{box-sizing:border-box}
  .font-display{font-family:'Archivo','Segoe UI',system-ui,sans-serif}
  .tnum{font-variant-numeric:tabular-nums}
  .eyebrow{font-family:'Archivo',system-ui,sans-serif;text-transform:uppercase;letter-spacing:.09em;font-weight:600;font-size:11px;line-height:1.2}
  h1,h2,h3{text-wrap:balance;margin:0}
  button{font:inherit;color:inherit}
  input,select,textarea{font:inherit;color:inherit}
  :where(button,a,input,select,textarea,[tabindex]):focus-visible{outline:2px solid rgb(var(--azure));outline-offset:2px;border-radius:6px}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:rgb(var(--line-2));border-radius:99px;border:3px solid rgb(var(--paper))}

  .fld{width:100%;background:rgb(var(--surface));border:1px solid rgb(var(--line-2));border-radius:10px;padding:10px 12px;font-size:15px}
  .fld::placeholder{color:rgb(var(--ink-3))}
  .fld:focus{outline:none;border-color:rgb(var(--azure));box-shadow:0 0 0 3px rgba(14,90,120,.18)}
  select.fld{appearance:none;background-image:linear-gradient(45deg,transparent 50%,rgb(var(--ink-2)) 50%),linear-gradient(135deg,rgb(var(--ink-2)) 50%,transparent 50%);background-position:calc(100% - 18px) 19px,calc(100% - 13px) 19px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:36px}

  .rail{position:relative}
  .rail::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:99px;background:var(--rail,rgb(var(--line-2)))}

  @keyframes bt-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .anim-in{animation:bt-in .22s ease-out both}
  @keyframes bt-fade{from{opacity:0}to{opacity:1}}
  .anim-fade{animation:bt-fade .18s ease-out both}
  @keyframes bt-sube{from{opacity:0;transform:translateY(22px) scale(.99)}to{opacity:1;transform:none}}
  .anim-sube{animation:bt-sube .26s cubic-bezier(.22,1,.36,1) both}
  @keyframes bt-giro{to{transform:rotate(360deg)}}
  .giro{animation:bt-giro .8s linear infinite}
  @keyframes bt-barra{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}
  .barra-carga{animation:bt-barra 1.15s cubic-bezier(.65,0,.35,1) infinite}
  @keyframes pulse-rec{0%,100%{opacity:1}50%{opacity:.35}}
  .rec{animation:pulse-rec 1.1s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* Hoja de documento: papel blanco siempre, porque se imprime */
  .doc{background:#fff;color:#111418;font-family:'Newsreader',Georgia,'Times New Roman',serif;font-size:15px;line-height:1.55}
  .doc *{box-sizing:border-box}
  .doc h1,.doc h2,.doc h3,.doc th{font-family:'Archivo','Segoe UI',sans-serif}
  .doc h1{font-size:17px;letter-spacing:.04em;text-transform:uppercase;text-align:center;font-weight:700;margin:0 0 4px}
  .doc h2{font-size:13.5px;letter-spacing:.06em;text-transform:uppercase;margin:22px 0 8px;font-weight:700;color:#0E5A78;border-bottom:1.5px solid #0E5A78;padding-bottom:4px}
  .doc h3{font-size:13px;margin:14px 0 4px;font-weight:600}
  .doc p{margin:0 0 9px;text-align:justify}
  .doc table{width:100%;border-collapse:collapse;margin:8px 0 14px;font-size:12.5px;font-family:'IBM Plex Sans',sans-serif}
  .doc th{background:#EAF1F4;border:1px solid #9FB4BD;padding:6px 7px;text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase}
  .doc td{border:1px solid #B9C6CB;padding:6px 7px;vertical-align:top}
  .doc .membrete{display:flex;gap:12px;align-items:center;border-bottom:2.5px solid #0E5A78;padding-bottom:10px;margin-bottom:6px}
  .doc .escudo{width:64px;height:auto;flex:none;display:block}
  .doc .escudo-alt{width:52px;height:60px;flex:none;border:1.5px solid #0E5A78;border-radius:4px 4px 26px 26px;display:flex;align-items:center;justify-content:center;font-family:'Archivo',sans-serif;font-weight:700;font-size:9px;color:#0E5A78;text-align:center;line-height:1.1;padding:4px}
  .doc .pie{margin-top:26px;border-top:1px solid #C7D2D6;padding-top:8px;font-family:'IBM Plex Sans',sans-serif;font-size:9.5px;line-height:1.45;color:#5d6f74;text-align:center}
  .doc .ctrl{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:#4a5a60;border-bottom:1px solid #C7D2D6;padding-bottom:6px;margin-bottom:16px;flex-wrap:wrap;gap:6px}
  .doc ol,.doc ul{margin:0 0 10px;padding-left:22px}
  .doc li{margin-bottom:4px}
  .doc .firma{margin-top:34px;display:flex;gap:26px;flex-wrap:wrap}
  .doc .firma div{flex:1 1 210px;border-top:1px solid #111;padding-top:5px;font-size:11.5px;font-family:'IBM Plex Sans',sans-serif}
  .doc .anexo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .doc .anexo-grid figure{margin:0;border:1px solid #C7D2D6;padding:6px;break-inside:avoid}
  .doc .anexo-grid img{width:100%;height:150px;object-fit:cover;display:block;background:#EEF1F2}
  .doc .anexo-grid figcaption{font-family:'IBM Plex Sans',sans-serif;font-size:10.5px;color:#4a5a60;padding-top:5px;line-height:1.35}
  .doc .nota{background:#F3F7F8;border-left:3px solid #0E5A78;padding:9px 12px;font-size:12.5px;font-family:'IBM Plex Sans',sans-serif;margin:10px 0}
  .doc .sello{border:2px solid #B32074;color:#B32074;border-radius:6px;padding:8px 12px;font-family:'Archivo',sans-serif;font-size:11px;letter-spacing:.06em;text-transform:uppercase;display:inline-block;transform:rotate(-2deg)}

  .bt-splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:rgb(var(--paper));z-index:60}
  .bt-splash-marca{width:62px;height:62px;border-radius:16px;background:rgb(var(--azure));color:rgb(var(--paper));display:flex;align-items:center;justify-content:center;font-family:'Archivo',sans-serif;font-weight:700;font-size:21px;letter-spacing:.04em;margin-bottom:10px}
  .bt-splash-nombre{margin:0;font-family:'Archivo',sans-serif;font-weight:700;font-size:16px;color:rgb(var(--ink))}
  .bt-splash-sub{margin:0;font-size:12.5px;color:rgb(var(--ink-3))}
  .bt-splash-pista{margin-top:16px;width:132px;height:3px;border-radius:99px;background:rgb(var(--surface-3));overflow:hidden}
  .bt-splash-pista span{display:block;width:30%;height:100%;border-radius:99px;background:rgb(var(--azure))}

  @media print{
    body.doc-open .app-shell{display:none!important}
    body.doc-open .doc-overlay{position:static!important;overflow:visible!important;background:#fff!important;padding:0!important}
    body.doc-open .doc-sheet{box-shadow:none!important;border:0!important;margin:0!important;max-width:none!important;padding:0!important;border-radius:0!important}
    .no-print{display:none!important}
    .pg-break{break-before:page;page-break-before:always}
    @page{margin:2cm 1.8cm}
  }
</style>

/* Compresión de fotos: el celular entrega 4 MB, el acta necesita 120 KB */
function comprimirImagen(file, maxLado = 1280, calidad = 0.62){
  return new Promise(resolve => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width:w, height:h } = img;
        const f = Math.min(1, maxLado / Math.max(w,h));
        w = Math.round(w*f); h = Math.round(h*f);
        try{
          const cv = document.createElement('canvas');
          cv.width = w; cv.height = h;
          cv.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve({ dataUrl: cv.toDataURL('image/jpeg', calidad), w, h });
        }catch(e){ resolve({ dataUrl: fr.result, w, h }); }
      };
      img.onerror = () => resolve({ dataUrl: fr.result, w:0, h:0 });
      img.src = fr.result;
    };
    fr.onerror = () => resolve(null);
    fr.readAsDataURL(file);
  });
}

function redactarInstitucional(nota, ctx = {}){
  let t = String(nota || '').trim();
  if (!t) return '';
  t = t.replace(/\s+/g,' ');
  t = t.replace(/\b([a-záéíóúñ]+)\b/gi, w => {
    const k = w.toLowerCase();
    return Object.prototype.hasOwnProperty.call(SIGLAS,k) ? SIGLAS[k] : w;
  });
  VERBOS.forEach(([re,rep]) => { t = t.replace(re, rep); });
  t = t.charAt(0).toLowerCase() + t.slice(1);
  t = t.replace(/\s+([,.;])/g,'$1').replace(/\s{2,}/g,' ').replace(/[.\s]+$/,'');

  const o = obl(ctx.obligacionId || 11);
  const apertura = APERTURAS[ctx.tipo] || 'se adelantó la actividad correspondiente a';
  const lugar = ctx.lugar ? ` en ${ctx.lugar}` : '';
  const fecha = ctx.fecha ? `el día ${diaSemana(ctx.fecha)} ${fechaLarga(ctx.fecha)}` : 'en la fecha de la presente';
  const instancia = ctx.instancia || o.corto;

  const p1 = `En cumplimiento de la obligación contractual N.º ${o.id} — ${o.titulo.replace(/\.$/,'')} —, ${fecha}${lugar} ${apertura} ${instancia}.`;
  const p2 = `Durante el desarrollo de la actividad ${t}.`;
  const partes = [p1, p2];

  if (ctx.participantes > 0)
    partes.push(`Se registró la participación de ${enLetras(ctx.participantes)} (${ctx.participantes}) ${ctx.participantes === 1 ? 'persona' : 'personas'}, conforme consta en la planilla de asistencia anexa.`);
  if (ctx.compromisos > 0)
    partes.push(`De la sesión se derivaron ${enLetras(ctx.compromisos)} (${ctx.compromisos}) compromisos institucionales, cuyo seguimiento queda a cargo de esta dependencia.`);
  if (ctx.evidencias > 0)
    partes.push(`Como soporte se anexan ${enLetras(ctx.evidencias)} (${ctx.evidencias}) registros de evidencia documental y fotográfica.`);

  partes.push('Lo anterior se reporta para efectos del seguimiento a la ejecución contractual y del informe mensual de actividades.');
  return partes.join(' ');
}

const diasDesde = iso => Math.round((parseISO(hoyISO()) - parseISO(iso)) / 86400000);
function fechaRelativa(iso){
  const d = diasDesde(iso);
  if (d <= 0) return 'hoy';
  if (d === 1) return 'ayer';
  if (d < 7) return `hace ${d} días`;
  return fechaCorta(iso);
}

const masFrecuente = (lista) => {
  const c = {};
  lista.filter(Boolean).forEach(v => { c[v] = (c[v] || 0) + 1; });
  let mejor = null, n = 0;
  Object.keys(c).forEach(k => { if (c[k] > n){ n = c[k]; mejor = k; } });
  return mejor;
};

/* Sugiere obligación, tipo, lugar e instancia a partir de lo que la usuaria
   ya viene registrando. Sin historia, cae en la primera obligación. */
function sugerirContexto(acts){
  const recientes = acts.filter(a => diasDesde(a.fecha) <= 60).slice(0, 40);
  if (!recientes.length) return { obligacionId:1, tipo:TIPOS[0], lugar:'', instancia:'', razon:'valor por defecto' };
  const obligacionId = Number(masFrecuente(recientes.map(a => a.obligacionId))) || 1;
  const delMismo = recientes.filter(a => a.obligacionId === obligacionId);
  return {
    obligacionId,
    tipo: masFrecuente(delMismo.map(a => a.tipo)) || TIPOS[0],
    lugar: masFrecuente(delMismo.map(a => a.lugar)) || '',
    instancia: masFrecuente(delMismo.map(a => a.instancia)) || '',
    razon: `lo más frecuente de tus últimos ${recientes.length} registros`
  };
}

/* Lugares que ya usó, para elegirlos con el pulgar en vez de escribirlos */
function lugaresFrecuentes(acts, obligacionId, max = 4){
  const propios = acts.filter(a => a.obligacionId === Number(obligacionId) && a.lugar);
  const otros = acts.filter(a => a.obligacionId !== Number(obligacionId) && a.lugar);
  const vistos = [];
  [...propios, ...otros].forEach(a => { if (!vistos.includes(a.lugar)) vistos.push(a.lugar); });
  return vistos.slice(0, max);
}

/* Instancias oficiales ya usadas en esa obligación, más las de los accesos directos */
function instanciasFrecuentes(acts, obligacionId, max = 4){
  const deAccesos = ACCESOS.filter(x => x.ob === Number(obligacionId) && x.instancia).map(x => x.instancia);
  const deHistoria = acts.filter(a => a.obligacionId === Number(obligacionId) && a.instancia).map(a => a.instancia);
  const vistos = [];
  [...deHistoria, ...deAccesos].forEach(v => { if (!vistos.includes(v)) vistos.push(v); });
  return vistos.slice(0, max);
}

function cargarEstado(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if (raw){
      let p = JSON.parse(raw);
      if (p && Array.isArray(p.actividades)){
        const config = { ...CONFIG_INICIAL, ...(p.config || {}) };
        // Una sola vez: se retiran los datos de muestra que traían las versiones
        // anteriores. Después, lo que se cargue desde Ajustes se respeta.
        if (!p.limpiezaDemo){
          p = { ...p,
            actividades:p.actividades.filter(a => !a.demo),
            evidencias:(p.evidencias || []).filter(e => !e.demo),
            actas:(p.actas || []).filter(a => !a.demo),
            limpiezaDemo:true };
        }
        // Migración: las versiones previas guardaban el municipio como marcador.
        if (String(config.municipio || '').indexOf('«') === 0){
          config.municipio = CONFIG_INICIAL.municipio;
          config.departamento = CONFIG_INICIAL.departamento;
          // Solo se pisa la secretaría si nunca se tocó: el valor editado manda.
          if (config.secretaria === 'Secretaría de Gobierno y Convivencia Ciudadana')
            config.secretaria = CONFIG_INICIAL.secretaria;
        }
        return { ...estadoInicial(), ...p, config };
      }
    }
  }catch(e){ /* almacenamiento bloqueado: se trabaja en memoria */ }
  return estadoInicial();
}
function guardarEstado(st){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(st)); return true; }
  catch(e){
    try{
      const liviano = { ...st, evidencias: st.evidencias.map(x => ({ ...x, dataUrl: x.dataUrl && x.dataUrl.length > 4000 ? null : x.dataUrl })) };
      localStorage.setItem(LS_KEY, JSON.stringify(liviano));
    }catch(e2){ /* sin persistencia: la sesión sigue funcionando en memoria */ }
    return false;
  }
}

async function copiarRico(html, textoPlano){
  try{
    if (navigator.clipboard && window.ClipboardItem){
      await navigator.clipboard.write([ new ClipboardItem({
        'text/html': new Blob([html], { type:'text/html' }),
        'text/plain': new Blob([textoPlano || html.replace(/<[^>]+>/g,' ')], { type:'text/plain' })
      })]);
      return true;
    }
  }catch(e){ /* se intenta la vía clásica */ }
  try{
    const d = document.createElement('div');
    d.contentEditable = 'true';
    d.style.cssText = 'position:fixed;left:-99999px;top:0;white-space:pre-wrap';
    d.innerHTML = html;
    document.body.appendChild(d);
    const r = document.createRange(); r.selectNodeContents(d);
    const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    const ok = document.execCommand('copy');
    s.removeAllRanges(); document.body.removeChild(d);
    return ok;
  }catch(e){ return false; }
}
function descargarDoc(nombre, html){
  try{
    const blob = new Blob(['﻿', html], { type:'application/msword' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = nombre; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
    return true;
  }catch(e){ return false; }
}

function escudoHTML(cfg){
  const src = (typeof window !== 'undefined' && window.ESCUDO_MUNICIPAL) || '';
  return src
    ? '<img class="escudo" src="' + src + '" alt="Escudo del municipio de ' + esc(cfg.municipio) + '">'
    : '<div class="escudo-alt">ESCUDO<br>MUNICIPAL</div>';
}

function pieInstitucional(cfg){
  const l1 = ['Alcaldía Municipal de ' + cfg.municipio + ' — ' + cfg.departamento,
              cfg.direccion, cfg.codigoPostal ? 'Código postal ' + cfg.codigoPostal : ''].filter(Boolean).join(' · ');
  const l2 = [cfg.telefono ? 'Conmutador ' + cfg.telefono : '', cfg.correo, cfg.web].filter(Boolean).join(' · ');
  return '<div class="pie">' + esc(l1) + '<br>' + esc(l2) + '</div>';
}

function membrete(cfg, titulo, sub){
  return '<div class="membrete">' + escudoHTML(cfg) + '<div style="flex:1">' +
    '<div style="font-family:Archivo,sans-serif;font-weight:700;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase">Alcaldía Municipal de ' + esc(cfg.municipio) + '</div>' +

    '<div style="font-size:11.5px;color:#5d6f74">' + esc(cfg.dependencia) + ' — ' + esc(cfg.departamento) + '</div>' +
    '</div></div>' +
    '<h1>' + esc(titulo) + '</h1>' +
    (sub ? '<div style="text-align:center;font-family:IBM Plex Mono,monospace;font-size:11px;color:#4a5a60;margin-bottom:8px">' + esc(sub) + '</div>' : '');
}
function ctrlDoc(cfg, codigo){
  return '<div class="ctrl"><span>Código: ' + esc(cfg.codigoFormato) + '</span><span>Versión: 02</span><span>' + esc(codigo) + '</span><span>Generado: ' + fechaLarga(hoyISO()) + '</span></div>';
}
function anexoFotografico(evs, desde){
  const fotos = evs.filter(e => e.tipo === 'foto' && e.dataUrl);
  const otros = evs.filter(e => e.tipo !== 'foto' || !e.dataUrl);
  let h = '';
  if (fotos.length){
    h += '<div class="anexo-grid">' + fotos.map((e,i) =>
      '<figure><img src="' + e.dataUrl + '" alt="' + esc(e.nombre) + '"><figcaption><strong>Registro ' + (desde+i) + '.</strong> ' + esc(e.nombre) + (e.descripcion ? ' — ' + esc(e.descripcion) : '') + '</figcaption></figure>'
    ).join('') + '</div>';
  }
  if (otros.length){
    h += '<p style="font-family:IBM Plex Sans,sans-serif;font-size:12px;margin-top:8px"><strong>Soportes documentales anexos:</strong> ' +
      otros.map(e => esc(e.nombre) + (e.descripcion ? ' (' + esc(e.descripcion) + ')' : '')).join(' · ') + '.</p>';
  }
  if (!h) h = '<p style="color:#7a8a90;font-style:italic">Sin evidencias cargadas para este ítem.</p>';
  return h;
}

/* ─────────── 6.1 ACTA DE COMITÉ ─────────── */
function construirActa(acta, st){
  const cfg = st.config;
  const o = obl(acta.obligacionId);
  const evs = st.evidencias.filter(e => (acta.evidencias || []).includes(e.id));
  const anio = (acta.fecha || hoyISO()).slice(0,4);
  const nro = 'ACTA N.º ' + acta.consecutivo + '-' + anio;
  const asis = acta.asistentes || [];
  const comp = acta.compromisos || [];

  let h = membrete(cfg, nro, acta.instancia);
  h += ctrlDoc(cfg, nro);

  h += '<table><tbody>' +
    '<tr><th style="width:26%">Instancia</th><td>' + esc(acta.instancia) + '</td></tr>' +
    '<tr><th>Fecha</th><td>' + diaSemana(acta.fecha) + ', ' + fechaLarga(acta.fecha) + '</td></tr>' +
    '<tr><th>Hora</th><td>Inicio ' + esc(acta.horaInicio) + ' — Finalización ' + esc(acta.horaFin) + '</td></tr>' +
    '<tr><th>Lugar</th><td>' + esc(acta.lugar) + '</td></tr>' +
    '<tr><th>Modalidad</th><td>' + esc(acta.modalidad) + '</td></tr>' +
    '<tr><th>Convoca</th><td>' + esc(acta.convoca) + '</td></tr>' +
    '<tr><th>Obligación contractual</th><td>N.º ' + o.id + ' — ' + esc(o.corto) + '</td></tr>' +
    '</tbody></table>';

  h += '<h2>1. Objetivo de la sesión</h2><p>' + esc(acta.objetivo) + '</p>';

  h += '<h2>2. Orden del día</h2><ol>' + (acta.ordenDia || []).map(p => '<li>' + esc(p) + '</li>').join('') + '</ol>';

  h += '<h2>3. Verificación del quórum y asistentes</h2>';
  h += '<p>Se verificó la asistencia de ' + enLetras(asis.length) + ' (' + asis.length + ') participantes, conforme a la planilla de asistencia que se anexa al presente documento.</p>';
  h += '<table><thead><tr><th style="width:6%">N.º</th><th>Nombre</th><th>Cargo</th><th>Entidad</th><th style="width:16%">Firma</th></tr></thead><tbody>' +
    (asis.length ? asis.map((a,i) => '<tr><td>' + (i+1) + '</td><td>' + esc(a.nombre) + '</td><td>' + esc(a.cargo) + '</td><td>' + esc(a.entidad) + '</td><td></td></tr>').join('')
    : '<tr><td colspan="5" style="color:#7a8a90;font-style:italic">Ver planilla de asistencia anexa.</td></tr>') +
    '</tbody></table>';

  h += '<h2>4. Desarrollo de la sesión</h2>';
  (acta.desarrollo || []).forEach(d => {
    const titulo = (acta.ordenDia || [])[d.punto-1] || ('Punto ' + d.punto);
    h += '<h3>4.' + d.punto + '. ' + esc(titulo) + '</h3><p>' + esc(d.texto) + '</p>';
  });

  h += '<h2>5. Compromisos</h2>';
  h += '<table><thead><tr><th style="width:6%">N.º</th><th>Compromiso</th><th>Responsable</th><th>Entidad</th><th style="width:13%">Fecha límite</th><th style="width:12%">Estado</th></tr></thead><tbody>' +
    (comp.length ? comp.map((c,i) => '<tr><td>' + (i+1) + '</td><td>' + esc(c.descripcion) + '</td><td>' + esc(c.responsable) + '</td><td>' + esc(c.entidad) + '</td><td>' + (c.fecha ? fechaLarga(c.fecha) : '—') + '</td><td>' + esc(c.estado) + '</td></tr>').join('')
    : '<tr><td colspan="6" style="color:#7a8a90;font-style:italic">La sesión no generó compromisos.</td></tr>') +
    '</tbody></table>';

  h += '<h2>6. Conclusiones y cierre</h2><p>' + esc(acta.conclusiones) + '</p>';

  h += '<h2 class="pg-break">7. Anexo fotográfico y documental</h2>' + anexoFotografico(evs, 1);

  h += '<div class="firma"><div>' + esc(acta.elaboradaPor || cfg.contratista) + '<br><span style="color:#4a5a60">Secretaría Técnica — ' + esc(cfg.dependencia) + '</span></div>' +
    '<div>' + esc(cfg.supervisor) + '<br><span style="color:#4a5a60">' + esc(cfg.cargoSupervisor) + '</span></div></div>';
  h += pieInstitucional(cfg);

  return { titulo:nro + ' — ' + acta.instancia, archivo:'Acta_' + acta.consecutivo + '_' + anio + '.doc', html:h };
}

/* ─────────── 6.2 INFORME MENSUAL DE EJECUCIÓN ─────────── */
function construirInforme(mk, st){
  const cfg = st.config;
  const acts = st.actividades.filter(a => mesDe(a.fecha) === mk).sort((a,b) => a.fecha.localeCompare(b.fecha));
  const actasMes = st.actas.filter(a => mesDe(a.fecha) === mk);
  const evsDe = a => st.evidencias.filter(e => (a.evidencias || []).includes(e.id));
  const totalEv = acts.reduce((n,a) => n + (a.evidencias || []).length, 0);
  const cumplidas = OBLIGACIONES.filter(o => acts.filter(a => a.obligacionId === o.id).length >= o.meta).length;

  let h = membrete(cfg, 'Informe mensual de ejecución contractual', 'Período: ' + mesLargo(mk));
  h += ctrlDoc(cfg, 'Contrato ' + cfg.contrato);

  h += '<table><tbody>' +
    '<tr><th style="width:26%">Contratista</th><td>' + esc(cfg.contratista) + ' — ' + esc(cfg.cedula) + '</td></tr>' +
    '<tr><th>Contrato N.º</th><td>' + esc(cfg.contrato) + '</td></tr>' +
    '<tr><th>Objeto</th><td>' + esc(cfg.objeto) + '</td></tr>' +
    '<tr><th>Período reportado</th><td>' + mesLargo(mk) + '</td></tr>' +
    '<tr><th>Supervisor</th><td>' + esc(cfg.supervisor) + ' — ' + esc(cfg.cargoSupervisor) + '</td></tr>' +
    '<tr><th>Valor a cobrar</th><td>' + esc(cfg.valorMes) + '</td></tr>' +
    '</tbody></table>';

  h += '<h2>1. Resumen ejecutivo del período</h2>';
  h += '<p>Durante el período comprendido en ' + mesLargo(mk) + ' se ejecutaron ' + enLetras(acts.length) + ' (' + acts.length + ') actividades asociadas a las once (11) obligaciones contractuales, se levantaron ' + enLetras(actasMes.length) + ' (' + actasMes.length + ') actas de instancias de participación y se compilaron ' + totalEv + ' soportes de evidencia. ' + cumplidas + ' de 11 obligaciones alcanzaron la meta mensual programada.</p>';

  h += '<table><thead><tr><th style="width:8%">N.º</th><th>Obligación contractual</th><th style="width:14%">Actividades</th><th style="width:12%">Evidencias</th><th style="width:14%">Cumplimiento</th></tr></thead><tbody>';
  OBLIGACIONES.forEach(o => {
    const sub = acts.filter(a => a.obligacionId === o.id);
    const ev = sub.reduce((n,a) => n + (a.evidencias || []).length, 0);
    const e = estadoSem(sub.length, o.meta);
    h += '<tr><td style="text-align:center">' + o.id + '</td><td>' + esc(o.corto) + '</td><td style="text-align:center">' + sub.length + ' / ' + o.meta + '</td><td style="text-align:center">' + ev + '</td><td>' + e.p + '% — ' + e.label + '</td></tr>';
  });
  h += '</tbody></table>';

  h += '<h2 class="pg-break">2. Desarrollo por obligación contractual</h2>';
  OBLIGACIONES.forEach(o => {
    const sub = acts.filter(a => a.obligacionId === o.id);
    h += '<h3>Obligación N.º ' + o.id + '. ' + esc(o.titulo) + '</h3>';
    if (!sub.length){
      h += '<p style="color:#5d6f74;font-style:italic">Durante el período reportado no se registraron actividades asociadas a esta obligación.</p>';
      return;
    }
    h += '<table><thead><tr><th style="width:12%">Fecha</th><th style="width:30%">Actividad</th><th>Descripción de la gestión</th><th style="width:10%">Soportes</th></tr></thead><tbody>';
    sub.forEach(a => {
      h += '<tr><td>' + fechaCorta(a.fecha) + '</td><td><strong>' + esc(a.titulo) + '</strong><br><span style="color:#5d6f74">' + esc(a.lugar) + '</span></td><td>' + esc(a.descripcion || a.notaCruda) + '</td><td style="text-align:center">' + (a.evidencias || []).length + '</td></tr>';
    });
    h += '</tbody></table>';
    const evs = sub.flatMap(evsDe);
    if (evs.length) h += anexoFotografico(evs, 1);
  });

  h += '<h2 class="pg-break">3. Certificación de cumplimiento</h2>';
  h += '<p>El suscrito contratista certifica que las actividades relacionadas en el presente informe fueron ejecutadas de manera directa y personal durante ' + mesLargo(mk) + ', en cumplimiento de las obligaciones pactadas en el contrato ' + esc(cfg.contrato) + ', y que los soportes documentales y fotográficos anexos corresponden fielmente a la gestión reportada.</p>';
  h += '<div class="nota">Este informe se presenta para efectos del trámite de cuenta de cobro correspondiente al período reportado, junto con la planilla de aportes a seguridad social y la certificación bancaria.</div>';
  h += '<div style="margin-top:14px"><span class="sello">Para trámite de cuenta de cobro</span></div>';
  h += '<div class="firma"><div>' + esc(cfg.contratista) + '<br><span style="color:#4a5a60">Contratista — ' + esc(cfg.cedula) + '</span></div>' +
    '<div>' + esc(cfg.supervisor) + '<br><span style="color:#4a5a60">' + esc(cfg.cargoSupervisor) + ' — Supervisor del contrato</span></div></div>';
  h += pieInstitucional(cfg);

  return { titulo:'Informe de ejecución — ' + mesLargo(mk), archivo:'Informe_' + mk + '.doc', html:h };
}

/* ─────────── 6.3 DIAPOSITIVAS EJECUTIVAS ─────────── */
function construirDiapositivas(mk, ids, st){
  const cfg = st.config;
  const acts = st.actividades.filter(a => mesDe(a.fecha) === mk);
  const sel = OBLIGACIONES.filter(o => ids.includes(o.id));
  const fotosDe = list => st.evidencias.filter(e => e.tipo === 'foto' && e.dataUrl && list.some(a => (a.evidencias || []).includes(e.id)));
  const totalActs = acts.filter(a => ids.includes(a.obligacionId)).length;
  const avanceGlobal = sel.length ? Math.round(sel.reduce((s,o) => s + estadoSem(acts.filter(a => a.obligacionId === o.id).length, o.meta).p, 0) / sel.length) : 0;

  const slides = [];
  slides.push({ t:'portada', titulo:'Avance de gestión territorial', sub:mesLargo(mk).toUpperCase(),
    linea1:cfg.secretaria, linea2:cfg.dependencia, municipio:cfg.municipio, autor:cfg.contratista,
    escudo:(typeof window !== 'undefined' && window.ESCUDO_MUNICIPAL) || '' });

  slides.push({ t:'kpi', titulo:'El período en cifras', sub:mesLargo(mk),
    kpis:[
      { v:String(totalActs), l:'Actividades ejecutadas' },
      { v:String(st.actas.filter(a => mesDe(a.fecha) === mk).length), l:'Actas levantadas' },
      { v:String(fotosDe(acts).length), l:'Registros fotográficos' },
      { v:avanceGlobal + '%', l:'Avance frente a la meta' }
    ]});

  slides.push({ t:'semaforo', titulo:'Semáforo de obligaciones', sub:'Cumplimiento frente a la meta mensual',
    filas: sel.map(o => {
      const n = acts.filter(a => a.obligacionId === o.id).length;
      const e = estadoSem(n, o.meta);
      return { cod:o.cod, nombre:o.corto, n, meta:o.meta, p:e.p, k:e.k, label:e.label };
    })});

  sel.forEach(o => {
    const sub = acts.filter(a => a.obligacionId === o.id);
    const e = estadoSem(sub.length, o.meta);
    slides.push({ t:'obligacion', cod:o.cod, titulo:o.corto, sub:o.eje, n:sub.length, meta:o.meta, p:e.p, k:e.k,
      logros: sub.slice(0,4).map(a => ({ fecha:fechaCorta(a.fecha), texto:a.titulo, lugar:a.lugar })),
      fotos: fotosDe(sub).slice(0,3).map(f => ({ src:f.dataUrl, pie:f.nombre })) });
  });

  const comps = st.actas.flatMap(a => (a.compromisos || []).map(c => ({ ...c, instancia:a.instancia })));
  if (comps.length) slides.push({ t:'compromisos', titulo:'Compromisos en seguimiento', sub:'Instancias coordinadas por la dependencia', filas:comps.slice(0,7) });

  slides.push({ t:'cierre', titulo:'Próximos pasos', sub:mesLargo(mk),
    puntos:[
      'Sostener la periodicidad de las instancias que alcanzaron la meta del período.',
      'Priorizar las obligaciones en rojo con cronograma de sesiones para el mes siguiente.',
      'Cerrar los compromisos vencidos con requerimiento escrito a las entidades responsables.',
      'Consolidar las evidencias faltantes antes del corte para la cuenta de cobro.'
    ], autor:cfg.contratista, dependencia:cfg.dependencia });

  return slides;
}
