/* Compresión de fotos: el celular entrega 4 MB, el acta necesita 120 KB */
function comprimirImagen(file, maxLado = 1280, calidad = 0.62){
  return new Promise(resolve => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width:w, height:h } = img;
        const f = Math.min(1, maxLado / Math.max(w,h));
        w = Math.round(w*f); h = Math.round(h*f);
        try{
          const cv = document.createElement('canvas');
          cv.width = w; cv.height = h;
          cv.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve({ dataUrl: cv.toDataURL('image/jpeg', calidad), w, h });
        }catch(e){ resolve({ dataUrl: fr.result, w, h }); }
      };
      img.onerror = () => resolve({ dataUrl: fr.result, w:0, h:0 });
      img.src = fr.result;
    };
    fr.onerror = () => resolve(null);
    fr.readAsDataURL(file);
  });
}

function redactarInstitucional(nota, ctx = {}){
  let t = String(nota || '').trim();
  if (!t) return '';
  t = t.replace(/\s+/g,' ');
  t = t.replace(/\b([a-záéíóúñ]+)\b/gi, w => {
    const k = w.toLowerCase();
    return Object.prototype.hasOwnProperty.call(SIGLAS,k) ? SIGLAS[k] : w;
  });
  VERBOS.forEach(([re,rep]) => { t = t.replace(re, rep); });
  t = t.charAt(0).toLowerCase() + t.slice(1);
  t = t.replace(/\s+([,.;])/g,'$1').replace(/\s{2,}/g,' ').replace(/[.\s]+$/,'');

  const o = obl(ctx.obligacionId || 11);
  const apertura = APERTURAS[ctx.tipo] || 'se adelantó la actividad correspondiente a';
  const lugar = ctx.lugar ? ` en ${ctx.lugar}` : '';
  const fecha = ctx.fecha ? `el día ${diaSemana(ctx.fecha)} ${fechaLarga(ctx.fecha)}` : 'en la fecha de la presente';
  const instancia = ctx.instancia || o.corto;

  const p1 = `En cumplimiento de la obligación contractual N.º ${o.id} — ${o.titulo.replace(/\.$/,'')} —, ${fecha}${lugar} ${apertura} ${instancia}.`;
  const p2 = `Durante el desarrollo de la actividad ${t}.`;
  const partes = [p1, p2];

  if (ctx.participantes > 0)
    partes.push(`Se registró la participación de ${enLetras(ctx.participantes)} (${ctx.participantes}) ${ctx.participantes === 1 ? 'persona' : 'personas'}, conforme consta en la planilla de asistencia anexa.`);
  if (ctx.compromisos > 0)
    partes.push(`De la sesión se derivaron ${enLetras(ctx.compromisos)} (${ctx.compromisos}) compromisos institucionales, cuyo seguimiento queda a cargo de esta dependencia.`);
  if (ctx.evidencias > 0)
    partes.push(`Como soporte se anexan ${enLetras(ctx.evidencias)} (${ctx.evidencias}) registros de evidencia documental y fotográfica.`);

  partes.push('Lo anterior se reporta para efectos del seguimiento a la ejecución contractual y del informe mensual de actividades.');
  return partes.join(' ');
}

const diasDesde = iso => Math.round((parseISO(hoyISO()) - parseISO(iso)) / 86400000);
function fechaRelativa(iso){
  const d = diasDesde(iso);
  if (d <= 0) return 'hoy';
  if (d === 1) return 'ayer';
  if (d < 7) return `hace ${d} días`;
  return fechaCorta(iso);
}

const masFrecuente = (lista) => {
  const c = {};
  lista.filter(Boolean).forEach(v => { c[v] = (c[v] || 0) + 1; });
  let mejor = null, n = 0;
  Object.keys(c).forEach(k => { if (c[k] > n){ n = c[k]; mejor = k; } });
  return mejor;
};

/* Sugiere obligación, tipo, lugar e instancia a partir de lo que la usuaria
   ya viene registrando. Sin historia, cae en la primera obligación. */
function sugerirContexto(acts){
  const recientes = acts.filter(a => diasDesde(a.fecha) <= 60).slice(0, 40);
  if (!recientes.length) return { obligacionId:1, tipo:TIPOS[0], lugar:'', instancia:'', razon:'valor por defecto' };
  const obligacionId = Number(masFrecuente(recientes.map(a => a.obligacionId))) || 1;
  const delMismo = recientes.filter(a => a.obligacionId === obligacionId);
  return {
    obligacionId,
    tipo: masFrecuente(delMismo.map(a => a.tipo)) || TIPOS[0],
    lugar: masFrecuente(delMismo.map(a => a.lugar)) || '',
    instancia: masFrecuente(delMismo.map(a => a.instancia)) || '',
    razon: `lo más frecuente de tus últimos ${recientes.length} registros`
  };
}

/* Lugares que ya usó, para elegirlos con el pulgar en vez de escribirlos */
function lugaresFrecuentes(acts, obligacionId, max = 4){
  const propios = acts.filter(a => a.obligacionId === Number(obligacionId) && a.lugar);
  const otros = acts.filter(a => a.obligacionId !== Number(obligacionId) && a.lugar);
  const vistos = [];
  [...propios, ...otros].forEach(a => { if (!vistos.includes(a.lugar)) vistos.push(a.lugar); });
  return vistos.slice(0, max);
}

/* Instancias oficiales ya usadas en esa obligación, más las de los accesos directos */
function instanciasFrecuentes(acts, obligacionId, max = 4){
  const deAccesos = ACCESOS.filter(x => x.ob === Number(obligacionId) && x.instancia).map(x => x.instancia);
  const deHistoria = acts.filter(a => a.obligacionId === Number(obligacionId) && a.instancia).map(a => a.instancia);
  const vistos = [];
  [...deHistoria, ...deAccesos].forEach(v => { if (!vistos.includes(v)) vistos.push(v); });
  return vistos.slice(0, max);
}
