function cargarEstado(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if (raw){
      let p = JSON.parse(raw);
      if (p && Array.isArray(p.actividades)){
        const config = { ...CONFIG_INICIAL, ...(p.config || {}) };
        // Una sola vez: se retiran los datos de muestra que traían las versiones
        // anteriores. Después, lo que se cargue desde Ajustes se respeta.
        if (!p.limpiezaDemo){
          p = { ...p,
            actividades:p.actividades.filter(a => !a.demo),
            evidencias:(p.evidencias || []).filter(e => !e.demo),
            actas:(p.actas || []).filter(a => !a.demo),
            limpiezaDemo:true };
        }
        // Migración: las versiones previas guardaban el municipio como marcador.
        if (String(config.municipio || '').indexOf('«') === 0){
          config.municipio = CONFIG_INICIAL.municipio;
          config.departamento = CONFIG_INICIAL.departamento;
          // Solo se pisa la secretaría si nunca se tocó: el valor editado manda.
          if (config.secretaria === 'Secretaría de Gobierno y Convivencia Ciudadana')
            config.secretaria = CONFIG_INICIAL.secretaria;
        }
        return { ...estadoInicial(), ...p, config };
      }
    }
  }catch(e){ /* almacenamiento bloqueado: se trabaja en memoria */ }
  return estadoInicial();
}
function guardarEstado(st){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(st)); return true; }
  catch(e){
    try{
      const liviano = { ...st, evidencias: st.evidencias.map(x => ({ ...x, dataUrl: x.dataUrl && x.dataUrl.length > 4000 ? null : x.dataUrl })) };
      localStorage.setItem(LS_KEY, JSON.stringify(liviano));
    }catch(e2){ /* sin persistencia: la sesión sigue funcionando en memoria */ }
    return false;
  }
}

async function copiarRico(html, textoPlano){
  try{
    if (navigator.clipboard && window.ClipboardItem){
      await navigator.clipboard.write([ new ClipboardItem({
        'text/html': new Blob([html], { type:'text/html' }),
        'text/plain': new Blob([textoPlano || html.replace(/<[^>]+>/g,' ')], { type:'text/plain' })
      })]);
      return true;
    }
  }catch(e){ /* se intenta la vía clásica */ }
  try{
    const d = document.createElement('div');
    d.contentEditable = 'true';
    d.style.cssText = 'position:fixed;left:-99999px;top:0;white-space:pre-wrap';
    d.innerHTML = html;
    document.body.appendChild(d);
    const r = document.createRange(); r.selectNodeContents(d);
    const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    const ok = document.execCommand('copy');
    s.removeAllRanges(); document.body.removeChild(d);
    return ok;
  }catch(e){ return false; }
}
function descargarDoc(nombre, html){
  try{
    const blob = new Blob(['﻿', html], { type:'application/msword' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = nombre; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
    return true;
  }catch(e){ return false; }
}
